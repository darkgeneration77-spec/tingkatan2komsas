<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banjir di Mata Emak - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · CERPEN</div><h1>Banjir di Mata Emak</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Sinopsis", "q": "Siapakah yang hendak dihubungi oleh watak “saya” pada awal cerita?", "options": ["Ameera", "Nana", "Nubhan", "Mak Piah"], "ans": 0, "exp": "Watak “saya” sebenarnya hendak menelefon rakannya, Ameera. 华语：一开始“我”是要打给朋友 Ameera。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Mengapakah watak “saya” berhubung dengan Mak Piah?", "options": ["Tersalah mendail nombor telefon", "Mak Piah menelefonnya dahulu", "Nana meminta bantuan", "Nubhan memperkenalkannya"], "ans": 0, "exp": "Hubungan bermula kerana “saya” tersalah mendail nombor Mak Piah. 华语：两人因为拨错电话而认识。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Siapakah yang disangka oleh Mak Piah sedang bercakap dengannya?", "options": ["Nana", "Ameera", "Misa", "Talia"], "ans": 0, "exp": "Mak Piah menyangka pemanggil itu ialah anaknya, Nana. 华语：Mak Piah 误以为对方是女儿 Nana。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah masalah utama yang dihadapi Mak Piah semasa banjir?", "options": ["Bekalan makanan habis dan dia tinggal seorang diri", "Rumahnya terbakar", "Dia kehilangan pekerjaan", "Dia tersesat"], "ans": 0, "exp": "Mak Piah menghadapi banjir, kekurangan makanan dan tinggal bersendirian. 华语：她面对洪水、食物短缺和独居。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Ke manakah jiran-jiran Mak Piah telah berpindah?", "options": ["Pusat pemindahan", "Bandar raya", "Rumah saudara jauh", "Hospital"], "ans": 0, "exp": "Jiran-jiran Mak Piah sudah berpindah ke pusat pemindahan. 华语：邻居们都去了疏散中心。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah bantuan yang diberikan oleh watak “saya” kepada Mak Piah?", "options": ["Membawa bekalan makanan", "Membelikan kereta", "Mencari pekerjaan", "Membina rumah baharu"], "ans": 0, "exp": "Watak “saya” pergi ke rumah Mak Piah dan membawa makanan. 华语：“我”亲自送食物给 Mak Piah。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang berlaku kepada Mak Piah selepas banjir surut?", "options": ["Meninggal dunia selepas tergelincir ketika membersihkan rumah", "Berpindah ke luar negara", "Tinggal bersama Nubhan", "Menjadi sihat sepenuhnya"], "ans": 0, "exp": "Mak Piah meninggal dunia selepas tergelincir ketika membersihkan rumah. 华语：洪水后她清理房屋时滑倒，后来去世。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Bagaimanakah perasaan Nana dan Nubhan selepas kematian Mak Piah?", "options": ["Menyesal", "Gembira", "Marah", "Tidak peduli"], "ans": 0, "exp": "Mereka menyesal kerana selama ini kurang mengambil berat terhadap ibu mereka. 华语：两人后来后悔没有好好关心母亲。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Banjir di Mata Emak ialah...", "options": ["Kasih sayang dan keprihatinan terhadap seorang ibu yang kesunyian akibat diabaikan anak-anak", "Keindahan alam", "Semangat patriotik", "Kehidupan di bandar"], "ans": 0, "exp": "Tema berkaitan kasih sayang, keprihatinan dan pengabaian terhadap ibu tua. 华语：核心是亲情、关怀与被子女忽略的老人。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam cerpen ini?", "options": ["Sikap anak-anak yang mengabaikan ibu bapa", "Kemajuan teknologi", "Persaingan akademik", "Keindahan bahasa"], "ans": 0, "exp": "Pengabaian ibu bapa ialah persoalan utama cerpen. 华语：子女忽略父母。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kesunyian Mak Piah menunjukkan persoalan...", "options": ["Warga tua yang tinggal seorang diri", "Kehidupan remaja", "Persaingan kerjaya", "Kemajuan masyarakat"], "ans": 0, "exp": "Mak Piah mewakili warga tua yang hidup sunyi dan terabai. 华语：独居老人容易孤独无助。"}, {"type": "mcq", "skill": "Persoalan", "q": "Watak “saya” membantu Mak Piah walaupun tidak mempunyai hubungan keluarga menunjukkan persoalan...", "options": ["Sikap suka membantu tanpa mengira hubungan", "Sikap mementingkan diri", "Persaingan keluarga", "Ketamakan"], "ans": 0, "exp": "Cerpen menekankan bantuan kepada orang lain tanpa mengira pertalian. 华语：即使不是亲人也可以帮助。"}, {"type": "mcq", "skill": "Watak", "q": "Apakah sifat utama watak “saya”?", "options": ["Prihatin dan penyayang", "Tamak dan kasar", "Malas dan sombong", "Pengecut dan penting diri"], "ans": 0, "exp": "Watak “saya” sangat prihatin, mudah bersimpati dan suka membantu. 华语：“我”有爱心、同情心并主动帮助。"}, {"type": "mcq", "skill": "Watak", "q": "Mak Piah digambarkan sebagai seorang ibu yang...", "options": ["sangat merindui anak-anaknya", "membenci keluarganya", "tidak peduli terhadap anak", "suka hidup bersendirian"], "ans": 0, "exp": "Mak Piah sentiasa merindui Nana dan Nubhan. 华语：她非常思念自己的孩子。"}, {"type": "mcq", "skill": "Watak", "q": "Apakah kelemahan utama Nana?", "options": ["Kurang bertanggungjawab terhadap ibunya", "Terlalu rajin", "Terlalu prihatin", "Terlalu berani"], "ans": 0, "exp": "Nana kurang mengambil berat dan kurang bertanggungjawab terhadap ibunya. 华语：她没有尽到照顾母亲的责任。"}, {"type": "mcq", "skill": "Watak", "q": "Nubhan tinggal tidak jauh daripada Mak Piah tetapi...", "options": ["jarang menjenguk ibunya", "selalu menjaga ibunya", "tinggal bersama ibunya", "membawa ibunya ke bandar"], "ans": 0, "exp": "Nubhan tinggal berdekatan tetapi jarang menjenguk Mak Piah. 华语：住得不远却很少探望母亲。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peristiwa permulaan cerpen?", "options": ["Watak “saya” tersalah mendail nombor Mak Piah", "Mak Piah meninggal dunia", "Nana pulang ke rumah", "Banjir surut"], "ans": 0, "exp": "Cerpen bermula dengan kesilapan mendail nombor telefon. 华语：故事从拨错电话开始。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peristiwa klimaks cerpen?", "options": ["Watak “saya” mengetahui Mak Piah telah meninggal dunia", "Watak “saya” menelefon Ameera", "Mak Piah menerima makanan", "Nana menelefon ibunya"], "ans": 0, "exp": "Klimaks berlaku apabila “saya” mendapat tahu Mak Piah telah meninggal dunia. 华语：高潮是“我”得知 Mak Piah 已去世。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peleraian cerpen?", "options": ["Nana dan Nubhan menyesali sikap mereka", "Watak “saya” tersalah telefon", "Mak Piah menghadapi banjir", "Jiran berpindah"], "ans": 0, "exp": "Peleraian menunjukkan penyesalan anak-anak selepas kehilangan ibu. 华语：结局是子女后悔。"}, {"type": "mcq", "skill": "Latar", "q": "Yang manakah latar tempat penting dalam cerpen?", "options": ["Rumah Mak Piah", "Istana", "Stadium", "Lapangan terbang"], "ans": 0, "exp": "Rumah Mak Piah ialah latar penting dalam cerita. 华语：Mak Piah 的家是主要地点。"}, {"type": "mcq", "skill": "Latar", "q": "Peristiwa utama cerpen berlaku ketika...", "options": ["musim banjir", "musim kemarau", "musim menuai", "musim cuti sekolah"], "ans": 0, "exp": "Cerpen berlaku ketika musim banjir. 华语：故事发生在洪水期间。"}, {"type": "mcq", "skill": "Latar", "q": "Masyarakat dalam cerpen ini turut memperlihatkan golongan yang...", "options": ["tidak bertanggungjawab terhadap ibu bapa", "tidak mempunyai keluarga", "sentiasa berhijrah", "hidup di istana"], "ans": 0, "exp": "Nana dan Nubhan mewakili golongan yang kurang bertanggungjawab terhadap ibu bapa. 华语：子女责任感不足。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai utama yang ditunjukkan watak “saya” ialah...", "options": ["Keprihatinan", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Watak “saya” sangat prihatin terhadap Mak Piah. 华语：关心。"}, {"type": "mcq", "skill": "Nilai", "q": "Mak Piah yang tetap menyayangi anak-anaknya menunjukkan nilai...", "options": ["Kasih sayang", "Kebencian", "Ketamakan", "Keberanian"], "ans": 0, "exp": "Kasih sayang seorang ibu tetap kuat walaupun anak-anak jarang menjenguk. 华语：母爱。"}, {"type": "mcq", "skill": "Nilai", "q": "Membantu orang yang berada dalam kesusahan menunjukkan nilai...", "options": ["Baik hati", "Sombong", "Tamak", "Malas"], "ans": 0, "exp": "Membantu orang susah menunjukkan nilai baik hati. 华语：善良。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah menyayangi dan menjaga ibu bapa selagi mereka masih hidup", "Kasih sayang", "Mak Piah", "Banjir"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat. 华语：要写完整的启示句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah membantu orang lain tanpa mengira...", "options": ["hubungan kekeluargaan", "umur sahaja", "pekerjaan sahaja", "tempat tinggal sahaja"], "ans": 0, "exp": "Cerpen menunjukkan kita boleh membantu walaupun bukan ahli keluarga. 华语：不论是否亲人，都可以帮助。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan terbaik anak-anak terhadap ibu bapa yang tinggal sendirian?", "options": ["Selalu bertanya khabar, melawat dan memastikan keperluan mereka terjaga", "Menunggu mereka meminta bantuan", "Menghubungi hanya ketika perlu", "Menganggap jiran akan menjaga mereka"], "ans": 0, "exp": "Hubungan yang konsisten dan tanggungjawab nyata penting terhadap ibu bapa yang tinggal sendiri. 华语：应主动联络、探望并照顾需要。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah penyesalan selepas kehilangan seseorang sering dianggap terlambat?", "options": ["Kerana peluang untuk memperbaiki hubungan mungkin sudah tiada", "Kerana orang lain akan marah", "Kerana keluarga menjadi lebih kaya", "Kerana semua masalah selesai"], "ans": 0, "exp": "Selepas seseorang meninggal dunia, peluang untuk menunjukkan kasih sayang sudah tiada. 华语：人离开后就失去弥补机会。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Banjir di Mata Emak?", "options": ["Jangan tunggu kehilangan ibu bapa baru hendak menghargai mereka", "Ibu bapa tidak memerlukan perhatian", "Orang tua harus hidup sendiri", "Bantuan hanya untuk ahli keluarga"], "ans": 0, "exp": "Cerpen menekankan kasih sayang, tanggungjawab dan penghargaan terhadap ibu bapa sebelum terlambat. 华语：不要等失去父母后才懂得珍惜。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_banjir_di_mata_emak_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_banjir_di_mata_emak_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
