<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dalam Persekitaran Kata-kata - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Dalam Persekitaran Kata-kata</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah anugerah Tuhan kepada manusia yang ditekankan dalam sajak ini?", "options": ["Bahasa dan akal", "Kekayaan dan kuasa", "Kecantikan dan kemasyhuran", "Tanah dan harta"], "ans": 0, "exp": "Sajak menekankan bahasa dan akal sebagai anugerah Tuhan. 华语：上苍赐予人类语言和思考能力。"}, {"type": "mcq", "skill": "Maksud", "q": "Mengapakah bahasa penting kepada manusia?", "options": ["Untuk menyampaikan makna, fikiran dan pengalaman", "Untuk menunjukkan kekayaan", "Untuk menguasai orang lain", "Untuk mengelakkan ilmu"], "ans": 0, "exp": "Bahasa membolehkan manusia menyampaikan makna, fikiran dan pengalaman. 华语：语言帮助传递思想、意义和经验。"}, {"type": "mcq", "skill": "Maksud", "q": "Bahasa membolehkan ilmu bergerak dari...", "options": ["satu tempat dan zaman ke tempat dan zaman yang lain", "rumah ke sekolah sahaja", "bandar ke kampung sahaja", "seorang guru kepada seorang murid sahaja"], "ans": 0, "exp": "Bahasa membolehkan ilmu merentas tempat dan zaman. 华语：知识能够跨地域、跨时代流传。"}, {"type": "mcq", "skill": "Maksud", "q": "Manusia diciptakan dalam...", "options": ["pelbagai bangsa dan rupa", "satu bangsa sahaja", "satu bahasa sahaja", "satu tempat sahaja"], "ans": 0, "exp": "Sajak menyatakan manusia terdiri daripada pelbagai bangsa dan rupa. 华语：人类拥有不同民族和外貌。"}, {"type": "mcq", "skill": "Maksud", "q": "Manusia menggunakan kata-kata untuk...", "options": ["memahami alam dan menambah ilmu", "mengelakkan pengetahuan", "membina konflik", "melupakan sejarah"], "ans": 0, "exp": "Bahasa membantu manusia memahami alam dan memperoleh ilmu. 华语：语言帮助理解自然并获取知识。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Dalam Persekitaran Kata-kata ialah...", "options": ["Kesyukuran atas nikmat berbahasa yang dikurniakan Tuhan", "Kasih sayang keluarga", "Semangat peperangan", "Kehidupan nelayan"], "ans": 0, "exp": "Tema utama ialah kesyukuran atas anugerah bahasa dan akal. 华语：感恩上苍赐予语言与思考能力。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam sajak ini?", "options": ["Peranan bahasa dalam perhubungan manusia", "Persaingan dalam sukan", "Kehidupan di ladang", "Kemiskinan bandar"], "ans": 0, "exp": "Bahasa menjadi alat perhubungan manusia. 华语：语言是沟通工具。"}, {"type": "mcq", "skill": "Persoalan", "q": "Penguasaan bahasa dapat...", "options": ["mengembangkan tamadun manusia", "menghapus ilmu", "mengurangkan komunikasi", "menjadikan manusia malas"], "ans": 0, "exp": "Bahasa membantu perkembangan tamadun. 华语：语言推动文明发展。"}, {"type": "mcq", "skill": "Persoalan", "q": "Bahasa menjadi medium untuk...", "options": ["menambahkan ilmu pengetahuan", "mengelakkan pembelajaran", "menutup komunikasi", "membina persengketaan"], "ans": 0, "exp": "Bahasa ialah medium utama untuk menambah dan menyampaikan ilmu. 华语：语言是获取和传播知识的重要媒介。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai paling utama dalam sajak ini ialah...", "options": ["Kesyukuran", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Manusia perlu bersyukur atas anugerah bahasa dan akal. 华语：感恩。"}, {"type": "mcq", "skill": "Nilai", "q": "Mempelajari bahasa secara bersungguh-sungguh menunjukkan nilai...", "options": ["Ketekunan", "Kemalasan", "Kesombongan", "Ketamakan"], "ans": 0, "exp": "Belajar bahasa dengan tekun menunjukkan ketekunan. 华语：勤奋。"}, {"type": "mcq", "skill": "Nilai", "q": "Berani merantau untuk mencari pengalaman menunjukkan nilai...", "options": ["Keberanian", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Merantau memerlukan keberanian. 华语：勇气。"}, {"type": "mcq", "skill": "Nilai", "q": "Bersungguh-sungguh memahami sumber ilmu menunjukkan nilai...", "options": ["Kesungguhan", "Kebencian", "Ketamakan", "Kesombongan"], "ans": 0, "exp": "Nilai yang sesuai ialah kesungguhan. 华语：认真努力。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah bersyukur atas nikmat bahasa dan akal", "Kesyukuran", "Bahasa", "Ilmu"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat lengkap. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah mempelajari bahasa dengan tekun supaya...", "options": ["dapat memperoleh ilmu pengetahuan", "dapat mengelakkan komunikasi", "menjadi lebih sombong", "tidak perlu membaca"], "ans": 0, "exp": "Bahasa membantu kita memperoleh ilmu. 华语：学好语言能帮助获取知识。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah menggunakan bahasa dengan baik untuk...", "options": ["menyampaikan ilmu dan membina tamadun", "menghina orang lain", "menutup pengetahuan", "mengelakkan sejarah"], "ans": 0, "exp": "Bahasa yang baik membantu menyampaikan ilmu dan membina tamadun. 华语：善用语言传播知识、建设文明。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak Dalam Persekitaran Kata-kata mempunyai berapa rangkap?", "options": ["3", "4", "5", "7"], "ans": 1, "exp": "Sajak ini mempunyai 4 rangkap. 华语：共有4节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Bilangan baris bagi setiap rangkap sajak ini...", "options": ["tidak sama", "semuanya 4 baris", "semuanya 5 baris", "semuanya 6 baris"], "ans": 0, "exp": "Bilangan baris setiap rangkap tidak sama. 华语：每节行数不同。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak ini berbentuk...", "options": ["bebas", "pantun terikat", "syair", "gurindam"], "ans": 0, "exp": "Dalam Persekitaran Kata-kata ialah sajak bebas. 华语：自由诗。"}, {"type": "mcq", "skill": "Bentuk", "q": "Nada sajak ini ialah...", "options": ["keagamaan", "romantik", "jenaka", "marah"], "ans": 0, "exp": "Nada sajak bersifat keagamaan dan penuh kesyukuran. 华语：带有宗教与感恩色彩。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan kata ganti tertentu untuk melambangkan Tuhan ialah...", "options": ["Perlambangan", "Simile", "Repetisi", "Sinkope"], "ans": 0, "exp": "Itu merupakan perlambangan. 华语：象征。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan yang sama pada awal baris disebut...", "options": ["Anafora", "Metafora", "Simile", "Personifikasi"], "ans": 0, "exp": "Anafora = pengulangan pada awal baris. 华语：首语重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan kata atau struktur pada kedudukan yang sama dalam baris berdekatan disebut...", "options": ["Responsi", "Hiperbola", "Inversi", "Sinkope"], "ans": 0, "exp": "Responsi ialah pengulangan pada kedudukan yang sama. 华语：对应重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan pulau, pantai, langit, bumi, laut dan gunung termasuk...", "options": ["Unsur alam", "Metafora", "Sinkope", "Hiperbola"], "ans": 0, "exp": "Itu ialah unsur alam. 华语：自然元素。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Anafora", "Responsi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Metafora", "Simile"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah bahasa penting kepada perkembangan tamadun?", "options": ["Bahasa menyimpan dan menyampaikan ilmu dari generasi ke generasi", "Bahasa menggantikan semua teknologi", "Bahasa menjadikan manusia kaya secara automatik", "Bahasa menghapus perbezaan manusia"], "ans": 0, "exp": "Bahasa membolehkan ilmu disimpan, dipelajari dan diwariskan. 华语：语言让知识被保存和传承。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan jika manusia tidak menjaga penggunaan bahasa?", "options": ["Komunikasi dan penyampaian ilmu boleh terganggu", "Semua masalah terus selesai", "Ilmu menjadi lebih mudah", "Tamadun berkembang lebih cepat"], "ans": 0, "exp": "Penggunaan bahasa yang lemah boleh mengganggu komunikasi dan penyampaian ilmu. 华语：语言使用不好会影响沟通和知识传播。"}, {"type": "mcq", "skill": "KBAT", "q": "Bagaimanakah pelajar boleh menunjukkan kesyukuran terhadap anugerah bahasa?", "options": ["Menggunakannya dengan sopan dan rajin menambah ilmu", "Menghina bahasa lain", "Mengelakkan membaca", "Menggunakan bahasa kasar"], "ans": 0, "exp": "Menggunakan bahasa dengan baik dan untuk menambah ilmu ialah cara bersyukur. 华语：善用语言、努力学习。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum sajak Dalam Persekitaran Kata-kata?", "options": ["Bahasa ialah anugerah Tuhan yang membantu manusia menyampaikan ilmu, membina tamadun dan memahami kehidupan", "Bahasa hanya penting untuk peperiksaan", "Bahasa tidak berkaitan dengan tamadun", "Ilmu tidak memerlukan bahasa"], "ans": 0, "exp": "Sajak menekankan bahasa sebagai anugerah Tuhan yang sangat penting kepada ilmu dan tamadun. 华语：语言是上苍赐予人类、推动知识与文明的重要礼物。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_dalam_persekitaran_kata_kata_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_dalam_persekitaran_kata_kata_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
