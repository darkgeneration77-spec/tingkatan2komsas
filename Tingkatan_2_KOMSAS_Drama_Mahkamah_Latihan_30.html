<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drama Mahkamah - Latihan 30 Soalan</title>
<style>:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;border:1px solid var(--border);padding:11px 12px;border-radius:12px;background:#fff}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · DRAMA</div><h1>Mahkamah</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"skill": "Sinopsis", "q": "Siapakah tertuduh dalam kes pertama drama Mahkamah?", "options": ["Bulat bin Leper", "Akinomoto", "Hakim", "Pendakwa Raya"], "ans": 0, "exp": "Bulat bin Leper ialah tertuduh dalam kes pertama. 华语：第一宗案件的被告是 Bulat bin Leper。"}, {"skill": "Sinopsis", "q": "Apakah pertuduhan terhadap Bulat bin Leper?", "options": ["Menyebabkan kematian seorang nenek tua akibat kulit pisang", "Mencuri beruk", "Merosakkan mahkamah", "Mencuri wang"], "ans": 0, "exp": "Bulat dituduh menyebabkan kematian seorang nenek tua selepas kejadian kulit pisang. 华语：他因香蕉皮事件被控间接导致老妇死亡。"}, {"skill": "Sinopsis", "q": "Apakah yang berlaku kepada nenek tua itu?", "options": ["Terpijak kulit pisang lalu terjatuh dan meninggal dunia", "Digigit anjing", "Dilanda banjir", "Diserang beruk"], "ans": 0, "exp": "Nenek itu terpijak kulit pisang, terjatuh dan meninggal dunia. 华语：老妇踩到香蕉皮后跌倒去世。"}, {"skill": "Sinopsis", "q": "Di manakah Bulat sebenarnya membuang kulit pisang?", "options": ["Ke dalam tong sampah", "Di tengah jalan", "Di atas meja", "Di dalam mahkamah"], "ans": 0, "exp": "Bulat membuang kulit pisang ke dalam tong sampah. 华语：Bulat 原本把香蕉皮丢进垃圾桶。"}, {"skill": "Sinopsis", "q": "Apakah faktor yang menyebabkan kulit pisang keluar daripada tong sampah?", "options": ["Seekor kambing menyelongkar tong sampah yang rosak", "Angin kuat", "Seorang budak membuangnya", "Hakim mengambilnya"], "ans": 0, "exp": "Tong sampah rosak dan seekor kambing menyelongkarnya. 华语：坏掉的垃圾桶被一只羊翻找，香蕉皮才掉出来。"}, {"skill": "Sinopsis", "q": "Apakah keputusan Hakim terhadap Bulat bin Leper?", "options": ["Dibebaskan", "Dipenjara seumur hidup", "Didenda sahaja", "Dihalau dari negeri"], "ans": 0, "exp": "Hakim membebaskan Bulat bin Leper. 华语：Bulat 最终获判无罪。"}, {"skill": "Sinopsis", "q": "Siapakah tertuduh dalam kes kedua?", "options": ["Akinomoto", "Bulat bin Leper", "Peguam Bela", "Hakim"], "ans": 0, "exp": "Kes kedua melibatkan Akinomoto. 华语：第二宗案件的被告是 Akinomoto。"}, {"skill": "Sinopsis", "q": "Apakah yang dicuri oleh Akinomoto?", "options": ["Seekor beruk", "Seekor kambing", "Seekor ayam", "Seekor rusa"], "ans": 0, "exp": "Akinomoto dituduh mencuri seekor beruk. 华语：Akinomoto 被控偷走一只 beruk。"}, {"skill": "Sinopsis", "q": "Apakah keputusan Hakim terhadap kes Akinomoto?", "options": ["Menjaga ibu beruk hingga beranak, kemudian memulangkan ibu beruk", "Dipenjara terus", "Membayar wang sahaja", "Melepaskan beruk ke hutan"], "ans": 0, "exp": "Hakim memerintahkan Akinomoto menjaga ibu beruk sehingga beranak sebelum memulangkannya. 华语：法官让他照顾母 beruk 到生产后归还。"}, {"skill": "Tema", "q": "Tema utama drama Mahkamah ialah...", "options": ["Keadilan dalam membuat keputusan berdasarkan bukti dan hujah", "Kasih sayang keluarga", "Keindahan alam", "Semangat patriotik"], "ans": 0, "exp": "Tema utama ialah keadilan dalam pengadilan. 华语：核心主题是依据证据和论点作出公平判决。"}, {"skill": "Persoalan", "q": "Yang manakah persoalan dalam drama ini?", "options": ["Kepentingan mendengar hujah kedua-dua pihak", "Kehidupan nelayan", "Kemajuan teknologi", "Persaingan akademik"], "ans": 0, "exp": "Mahkamah perlu mendengar hujah kedua-dua pihak sebelum membuat keputusan. 华语：判决前必须听取双方陈述。"}, {"skill": "Persoalan", "q": "Hukuman yang dijatuhkan hendaklah...", "options": ["sesuai dengan kesalahan", "seberat mungkin", "mengikut emosi", "berdasarkan khabar angin"], "ans": 0, "exp": "Hukuman perlu setimpal dan sesuai dengan kesalahan. 华语：处罚必须与错误相称。"}, {"skill": "Persoalan", "q": "Drama ini juga menekankan tanggungjawab terhadap...", "options": ["perbuatan sendiri", "harta orang lain sahaja", "hiburan", "persaingan"], "ans": 0, "exp": "Setiap individu perlu bertanggungjawab terhadap perbuatannya. 华语：每个人都要为自己的行为负责。"}, {"skill": "Watak", "q": "Apakah sifat Hakim?", "options": ["Adil dan bijaksana", "Tamak dan kasar", "Malas dan cuai", "Sombong dan terburu-buru"], "ans": 0, "exp": "Hakim digambarkan adil, bijaksana dan tegas. 华语：公平、智慧、果断。"}, {"skill": "Watak", "q": "Apakah peranan Peguam Bela?", "options": ["Mempertahankan tertuduh berdasarkan fakta dan hujah", "Menjatuhkan hukuman", "Menjadi saksi utama", "Mengurus mahkamah"], "ans": 0, "exp": "Peguam bela mempertahankan tertuduh. 华语：辩护律师为被告辩护。"}, {"skill": "Watak", "q": "Apakah peranan Pendakwa Raya?", "options": ["Mendakwa tertuduh berdasarkan pertuduhan", "Membebaskan tertuduh", "Menjadi hakim", "Menjaga beruk"], "ans": 0, "exp": "Pendakwa raya membawa pertuduhan terhadap tertuduh. 华语：检察方负责提出指控。"}, {"skill": "Plot", "q": "Apakah peristiwa permulaan drama?", "options": ["Bulat bin Leper dibawa ke mahkamah untuk dibicarakan", "Akinomoto dibebaskan", "Hakim pulang", "Beruk melahirkan anak"], "ans": 0, "exp": "Drama bermula dengan perbicaraan Bulat bin Leper. 华语：戏剧从 Bulat 的审讯开始。"}, {"skill": "Plot", "q": "Apakah yang berlaku dalam perkembangan kes pertama?", "options": ["Pendakwa membaca pertuduhan dan Peguam Bela mengemukakan hujah", "Hakim terus menghukum", "Mahkamah ditutup", "Akinomoto melarikan diri"], "ans": 0, "exp": "Perbicaraan berkembang melalui pertuduhan dan hujah pembelaan. 华语：剧情通过控方指控和辩方论点推进。"}, {"skill": "Plot", "q": "Apakah peleraian drama?", "options": ["Kes Bulat diputuskan dan kes Akinomoto pula diselesaikan", "Semua tertuduh dipenjara", "Mahkamah terbakar", "Hakim berhenti kerja"], "ans": 0, "exp": "Peleraian melibatkan keputusan terhadap kedua-dua kes. 华语：两宗案件都获得判决。"}, {"skill": "Latar", "q": "Latar tempat utama drama ialah...", "options": ["Mahkamah", "Sekolah", "Istana", "Hospital"], "ans": 0, "exp": "Drama berlaku terutamanya di mahkamah. 华语：主要地点是法庭。"}, {"skill": "Latar", "q": "Latar masyarakat dalam drama ini termasuk...", "options": ["Golongan profesional seperti hakim, pendakwa raya dan peguam bela", "Masyarakat petani", "Masyarakat nelayan", "Masyarakat tentera"], "ans": 0, "exp": "Drama memaparkan golongan profesional dalam sistem perundangan. 华语：法官、检察官、律师等法律专业人士。"}, {"skill": "Nilai", "q": "Nilai utama yang ditunjukkan oleh Hakim ialah...", "options": ["Keadilan", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Hakim menegakkan keadilan. 华语：公正。"}, {"skill": "Nilai", "q": "Membuat keputusan berdasarkan fakta menunjukkan nilai...", "options": ["Rasional", "Tamak", "Sombong", "Malas"], "ans": 0, "exp": "Keputusan berdasarkan fakta menunjukkan sikap rasional. 华语：理智。"}, {"skill": "Nilai", "q": "Menjalankan tugas dengan tegas menunjukkan nilai...", "options": ["Ketegasan", "Kemarahan", "Ketamakan", "Kesombongan"], "ans": 0, "exp": "Hakim perlu tegas dalam mengendalikan perbicaraan. 华语：果断。"}, {"skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah membuat keputusan berdasarkan bukti", "Keadilan", "Mahkamah", "Hakim"], "ans": 0, "exp": "Pengajaran perlu berbentuk tindakan atau nasihat lengkap. 华语：启示要写完整句。"}, {"skill": "Pengajaran", "q": "Kita mestilah mendengar penjelasan kedua-dua pihak sebelum...", "options": ["membuat kesimpulan", "menjatuhkan tuduhan sesuka hati", "meninggalkan tempat", "menyalahkan orang lain"], "ans": 0, "exp": "Mendengar kedua-dua pihak membantu keputusan lebih adil. 华语：下结论前要听双方解释。"}, {"skill": "Gaya Bahasa", "q": "Perkataan seperti “tertuduh”, “pendakwa raya” dan “peguam bela” ialah...", "options": ["Bahasa undang-undang", "Bahasa klasik", "Bahasa pasar", "Bahasa sains"], "ans": 0, "exp": "Itu ialah istilah undang-undang. 华语：法律用语。"}, {"skill": "Gaya Bahasa", "q": "Bahasa yang digunakan dalam suasana mahkamah kebanyakannya...", "options": ["formal", "kasar", "slanga", "rojak"], "ans": 0, "exp": "Bahasa mahkamah bersifat formal. 华语：法庭语言较正式。"}, {"skill": "KBAT", "q": "Mengapakah hakim tidak boleh menghukum berdasarkan tanggapan awal?", "options": ["Kerana fakta dan bukti mungkin menunjukkan keadaan sebenar yang berbeza", "Kerana hukuman tidak penting", "Kerana semua tertuduh tidak bersalah", "Kerana perbicaraan membuang masa"], "ans": 0, "exp": "Hakim mesti menilai bukti sebelum membuat keputusan. 华语：不能凭表面判断，必须先看证据。"}, {"skill": "Keseluruhan", "q": "Apakah mesej umum drama Mahkamah?", "options": ["Keadilan memerlukan bukti, hujah, kebijaksanaan dan keputusan yang setimpal", "Semua tertuduh perlu dihukum", "Hukuman mesti paling berat", "Peguam lebih penting daripada hakim"], "ans": 0, "exp": "Drama menekankan keadilan berdasarkan fakta dan pertimbangan yang bijaksana. 华语：公平判决必须建立在证据、论点和合理判断之上。"}];const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{let c=document.createElement('div');c.className='card';c.id='qcard'+i;c.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(c)})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});done.textContent=n}
function submitQuiz(){let score=0,skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;let s=document.querySelector(`input[name=q${i}]:checked`),r=document.getElementById('res'+i);r.style.display='block';if(s&&+s.value===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});let pct=Math.round(score/30*100);document.getElementById('score').textContent=score+'/30';percent.textContent=pct+'%';summary.style.display='block';summaryText.innerHTML=`<p><b>${score} / 30 (${pct}%)</b></p>`;skillsEl='';Object.entries(skills).forEach(([k,v])=>{let p=Math.round(v.ok/v.total*100);skillsEl+=`<div><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=skillsEl;localStorage.setItem('komsas_drama_mahkamah_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));}
function showWrong(){QUESTIONS.forEach((x,i)=>{let s=document.querySelector(`input[name=q${i}]:checked`);qcard=document.getElementById('qcard'+i);qcard.style.display=(!s||+s.value!==x.ans)?'block':'none'})}
function resetQuiz(){localStorage.removeItem('komsas_drama_mahkamah_result');render();done.textContent='0';score.textContent='-';percent.textContent='-';summary.style.display='none'}
render();
</script></body></html>
