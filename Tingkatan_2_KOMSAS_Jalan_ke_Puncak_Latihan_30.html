<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jalan ke Puncak - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · NOVEL</div><h1>Jalan ke Puncak</h1><div class="sub">Juri Durabi · Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"skill": "Sinopsis", "q": "Siapakah watak utama novel Jalan ke Puncak?", "options": ["Laiman", "Milan", "Ayah Laiman", "Sidek"], "ans": 0, "exp": "Watak utama ialah Laiman. 华语：主角是 Laiman。"}, {"skill": "Sinopsis", "q": "Apakah bidang pengajian Laiman?", "options": ["Kejuruteraan", "Ekonomi", "Perubatan", "Undang-undang"], "ans": 0, "exp": "Laiman ialah mahasiswa bidang kejuruteraan. 华语：Laiman 修读工程。"}, {"skill": "Sinopsis", "q": "Di manakah Laiman menjalani latihan industri?", "options": ["Sebuah syarikat minyak di Sarawak", "Sebuah sekolah di Sabah", "Sebuah hospital di Kuala Lumpur", "Sebuah bank di Johor"], "ans": 0, "exp": "Laiman menjalani latihan industri di sebuah syarikat minyak di Sarawak. 华语：他在砂拉越一家石油公司实习。"}, {"skill": "Sinopsis", "q": "Selepas tamat pengajian, apakah pilihan Laiman?", "options": ["Berdikari melalui pertanian dan penternakan", "Terus menjadi pegawai kerajaan", "Berpindah ke luar negara", "Berhenti bekerja"], "ans": 0, "exp": "Laiman memilih untuk berdikari melalui pertanian dan penternakan. 华语：毕业后他选择农业与养殖创业。"}, {"skill": "Sinopsis", "q": "Siapakah rakan penting yang membantu usaha Laiman?", "options": ["Milan", "Abang Man", "Nubhan", "Tuk Sibat"], "ans": 0, "exp": "Milan ialah rakan usaha Laiman. 华语：Milan 是 Laiman 的重要伙伴。"}, {"skill": "Sinopsis", "q": "Yang manakah antara projek yang diusahakan Laiman?", "options": ["Kebun tembikai", "Ladang teh", "Kilang roti", "Kebun bunga"], "ans": 0, "exp": "Laiman mengusahakan kebun tembikai. 华语：他经营西瓜园。"}, {"skill": "Sinopsis", "q": "Selain tanaman, Laiman juga menjalankan projek...", "options": ["Ternakan ikan air tawar", "Ternakan kuda lumba", "Ternakan unta", "Penternakan burung eksotik"], "ans": 0, "exp": "Laiman mengusahakan ternakan ikan air tawar. 华语：他也发展淡水鱼养殖。"}, {"skill": "Sinopsis", "q": "Apakah reaksi awal ayah Laiman terhadap pilihan kerjayanya?", "options": ["Kurang bersetuju", "Sangat gembira", "Tidak peduli", "Terus membantu sepenuhnya"], "ans": 0, "exp": "Ayah Laiman pada awalnya kurang bersetuju kerana berharap anaknya bekerja sesuai dengan kelulusan. 华语：父亲起初不认同。"}, {"skill": "Tema", "q": "Tema utama Jalan ke Puncak ialah...", "options": ["Kegigihan pemuda berpendidikan membina kejayaan melalui pertanian dan keusahawanan", "Kasih sayang keluarga semata-mata", "Semangat patriotik", "Kehidupan nelayan"], "ans": 0, "exp": "Tema menekankan kegigihan, ilmu dan keusahawanan. 华语：受教育青年凭努力与创业精神在农业领域取得成功。"}, {"skill": "Persoalan", "q": "Yang manakah persoalan dalam novel ini?", "options": ["Golongan muda boleh mencipta peluang pekerjaan sendiri", "Kehidupan di istana", "Persaingan sukan", "Kemajuan tentera"], "ans": 0, "exp": "Novel menunjukkan graduan boleh mencipta peluang melalui keusahawanan. 华语：年轻人可以自己创造就业机会。"}, {"skill": "Persoalan", "q": "Pilihan Laiman membuktikan bahawa graduan universiti tidak semestinya...", "options": ["bekerja makan gaji", "menuntut ilmu", "membantu keluarga", "berusaha"], "ans": 0, "exp": "Graduan tidak semestinya bergantung pada pekerjaan makan gaji. 华语：大学毕业生不一定只能做受薪工作。"}, {"skill": "Persoalan", "q": "Kerjasama Laiman dan Milan menunjukkan persoalan...", "options": ["Muafakat membantu kejayaan usaha", "Persaingan merosakkan semua projek", "Kekayaan lebih penting", "Ilmu tidak diperlukan"], "ans": 0, "exp": "Kerjasama membantu menjayakan projek. 华语：合作能推动事业成功。"}, {"skill": "Watak", "q": "Apakah sifat utama Laiman?", "options": ["Gigih dan berdikari", "Tamak dan kasar", "Malas dan sombong", "Pengecut dan cuai"], "ans": 0, "exp": "Laiman gigih, berdikari dan tidak mudah berputus asa. 华语：坚持、自立、不轻易放弃。"}, {"skill": "Watak", "q": "Milan digambarkan sebagai seorang yang...", "options": ["Rajin dan bekerjasama", "Tamak dan malas", "Sombong dan kasar", "Cuai dan penting diri"], "ans": 0, "exp": "Milan rajin dan sanggup bekerjasama dengan Laiman. 华语：勤奋并愿意合作。"}, {"skill": "Watak", "q": "Ayah Laiman sebenarnya...", "options": ["Mengambil berat tentang masa depan anaknya", "Tidak peduli langsung", "Membenci Laiman", "Mahu Laiman gagal"], "ans": 0, "exp": "Walaupun kurang bersetuju, ayah Laiman mengambil berat tentang masa depan anaknya. 华语：虽然反对，但父亲其实关心儿子的未来。"}, {"skill": "Plot", "q": "Apakah peristiwa permulaan novel?", "options": ["Laiman menjalani latihan industri", "Laiman berjaya dalam pertanian", "Ayah Laiman bersetuju sepenuhnya", "Milan membuka syarikat"], "ans": 0, "exp": "Novel bermula dengan pengalaman latihan industri Laiman. 华语：故事从工业实习阶段展开。"}, {"skill": "Plot", "q": "Apakah konflik utama selepas Laiman tamat belajar?", "options": ["Pilihan kerjayanya kurang diterima ayahnya", "Dia kehilangan semua wang", "Milan meninggalkannya", "Dia berpindah ke luar negara"], "ans": 0, "exp": "Konflik utama ialah pilihan kerjaya Laiman yang tidak mudah diterima ayahnya. 华语：父子之间因职业选择产生冲突。"}, {"skill": "Plot", "q": "Apakah peleraian novel?", "options": ["Usaha Laiman berjaya dan pandangan orang terhadap pilihannya berubah", "Semua projek dihentikan", "Laiman kembali menjadi pelajar", "Milan berpindah"], "ans": 0, "exp": "Akhirnya usaha Laiman berjaya dan orang lain mula menerima pilihannya. 华语：创业成功后，别人也改变看法。"}, {"skill": "Teknik Plot", "q": "Perbualan antara watak untuk memperlihatkan konflik disebut...", "options": ["Dialog", "Imbas kembali", "Monolog dalaman", "Pemerian"], "ans": 0, "exp": "Dialog digunakan untuk memperlihatkan pendirian dan konflik. 华语：对话推动冲突。"}, {"skill": "Teknik Plot", "q": "Peristiwa lalu yang diceritakan semula disebut...", "options": ["Imbas kembali", "Saspens", "Dialog", "Monolog"], "ans": 0, "exp": "Imbas kembali = flashback. 华语：倒叙。"}, {"skill": "Teknik Plot", "q": "Pembaca ingin mengetahui sama ada rancangan Laiman berjaya. Teknik ini disebut...", "options": ["Saspens", "Metafora", "Anafora", "Repetisi"], "ans": 0, "exp": "Saspens menimbulkan rasa ingin tahu. 华语：悬念。"}, {"skill": "Latar", "q": "Yang manakah latar tempat dalam novel?", "options": ["Sarawak", "Istana", "Lapangan terbang antarabangsa", "Stadium"], "ans": 0, "exp": "Sarawak ialah salah satu latar penting. 华语：砂拉越是主要背景之一。"}, {"skill": "Latar", "q": "Latar masyarakat dalam novel termasuk...", "options": ["Golongan muda yang berusaha berdikari", "Masyarakat istana", "Masyarakat tentera", "Masyarakat nelayan sahaja"], "ans": 0, "exp": "Novel memaparkan golongan muda yang mahu berdikari dan mencipta kerjaya. 华语：年轻人努力自立创业。"}, {"skill": "Nilai", "q": "Laiman yang terus berusaha walaupun ditentang menunjukkan nilai...", "options": ["Kegigihan", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Laiman menunjukkan kegigihan. 华语：坚持不懈。"}, {"skill": "Nilai", "q": "Laiman dan Milan mengusahakan projek bersama menunjukkan nilai...", "options": ["Kerjasama", "Ketamakan", "Kebencian", "Kesombongan"], "ans": 0, "exp": "Mereka menunjukkan nilai kerjasama. 华语：合作。"}, {"skill": "Nilai", "q": "Laiman berani memilih laluan kerjaya sendiri menunjukkan nilai...", "options": ["Keberanian", "Kemalasan", "Kesombongan", "Ketamakan"], "ans": 0, "exp": "Laiman berani mengambil risiko dan mempertahankan pilihannya. 华语：勇于选择自己的道路。"}, {"skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah gigih berusaha untuk mencapai kejayaan", "Kegigihan", "Laiman", "Pertanian"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat lengkap. 华语：启示要写完整句。"}, {"skill": "Pengajaran", "q": "Kita hendaklah menggunakan ilmu dan pengalaman untuk...", "options": ["memajukan diri", "menghina orang lain", "mengelak tanggungjawab", "menolak perubahan"], "ans": 0, "exp": "Ilmu dan pengalaman perlu digunakan untuk kemajuan diri. 华语：善用知识与经验发展自己。"}, {"skill": "KBAT", "q": "Mengapakah golongan muda perlu berani mencipta peluang pekerjaan?", "options": ["Kerana mereka boleh membina kerjaya sendiri dan tidak bergantung sepenuhnya pada pekerjaan sedia ada", "Kerana semua kerja makan gaji buruk", "Kerana perniagaan sentiasa mudah", "Kerana risiko tidak wujud"], "ans": 0, "exp": "Keusahawanan boleh membuka laluan kerjaya baharu dan meningkatkan berdikari. 华语：创业能创造新的就业和发展机会。"}, {"skill": "Keseluruhan", "q": "Apakah mesej umum Jalan ke Puncak?", "options": ["Ilmu, keberanian, kerjasama dan kegigihan boleh membawa kejayaan dalam keusahawanan", "Graduan mesti bekerja makan gaji", "Pertanian tidak sesuai untuk golongan berpendidikan", "Risiko harus dielakkan sepenuhnya"], "ans": 0, "exp": "Novel menekankan ilmu, usaha, keberanian dan kerjasama sebagai jalan menuju kejayaan. 华语：知识、勇气、合作与坚持能带来创业成功。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_jalan_ke_puncak_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_jalan_ke_puncak_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
