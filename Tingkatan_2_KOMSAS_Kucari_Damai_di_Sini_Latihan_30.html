<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kucari Damai di Sini - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Kucari Damai di Sini</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah yang dicari oleh penyajak dalam sajak Kucari Damai di Sini?", "options": ["Kedamaian", "Kekayaan", "Kemasyhuran", "Kemenangan"], "ans": 0, "exp": "Penyajak mencari kedamaian di tanah airnya. 华语：诗人在祖国中寻找和平。"}, {"type": "mcq", "skill": "Maksud", "q": "Di manakah penyajak mencari kedamaian?", "options": ["Di tanah air yang subur, makmur dan merdeka", "Di negara asing", "Di bandar sahaja", "Di medan perang"], "ans": 0, "exp": "Penyajak mencari kedamaian di tanah air yang subur, makmur dan merdeka. 华语：在富饶、繁荣和独立的祖国中寻找和平。"}, {"type": "mcq", "skill": "Maksud", "q": "Kedamaian perlu dibina melalui...", "options": ["persaudaraan dan rasa kemanusiaan", "kekayaan dan kuasa", "persaingan dan dendam", "ketakutan dan paksaan"], "ans": 0, "exp": "Kedamaian dibina melalui persaudaraan dan kemanusiaan. 华语：和平建立在兄弟情谊和人道精神之上。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah yang membantu mewujudkan kedamaian dalam diri rakyat?", "options": ["Cinta akan negara, jati diri dan kasih sayang", "Ketamakan", "Kebencian", "Persaingan"], "ans": 0, "exp": "Cinta negara, jati diri dan kasih sayang membantu mewujudkan kedamaian. 华语：爱国、身份认同和关爱促进和平。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah harapan penyajak terhadap negara pada masa depan?", "options": ["Kegemilangan negara berkekalan dan dibanggakan generasi akan datang", "Negara menjadi semakin lemah", "Rakyat meninggalkan negara", "Kemerdekaan diabaikan"], "ans": 0, "exp": "Penyajak berharap kegemilangan negara terus berkekalan. 华语：希望国家的辉煌长久延续。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Kucari Damai di Sini ialah...", "options": ["Penghargaan terhadap kedamaian dan kesejahteraan negara", "Kasih sayang keluarga", "Keindahan alam", "Kehidupan di bandar"], "ans": 0, "exp": "Tema menekankan penghargaan terhadap kedamaian dan kesejahteraan negara. 华语：珍惜国家和平与安宁。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam sajak ini?", "options": ["Kedamaian perlu diusahakan dan dipelihara", "Kehidupan nelayan", "Kemajuan teknologi", "Persaingan sukan"], "ans": 0, "exp": "Kedamaian perlu diusahakan dan dipelihara ialah persoalan utama. 华语：和平需要共同维护。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kemerdekaan perlu dipertahankan demi...", "options": ["kemajuan negara", "hiburan rakyat", "keuntungan individu", "persaingan"], "ans": 0, "exp": "Kemerdekaan perlu dipertahankan demi kemajuan negara. 华语：维护独立，国家才能继续发展。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kasih sayang dan persaudaraan dapat...", "options": ["mewujudkan kedamaian", "menambah konflik", "menghapus jati diri", "mengurangkan perpaduan"], "ans": 0, "exp": "Kasih sayang dan persaudaraan mengukuhkan kedamaian. 华语：关爱与团结能促进和平。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang paling utama dalam sajak ini ialah...", "options": ["Kedamaian", "Ketamakan", "Kemalasan", "Kesombongan"], "ans": 0, "exp": "Nilai teras ialah kedamaian. 华语：和平。"}, {"type": "mcq", "skill": "Nilai", "q": "Mencintai dan menghargai negara menunjukkan nilai...", "options": ["Patriotisme", "Ketamakan", "Kemarahan", "Kemalasan"], "ans": 0, "exp": "Cinta akan negara menunjukkan patriotisme. 华语：爱国。"}, {"type": "mcq", "skill": "Nilai", "q": "Rakyat yang saling menghormati menunjukkan nilai...", "options": ["Hormat-menghormati", "Ketamakan", "Kesombongan", "Kebencian"], "ans": 0, "exp": "Saling menghormati ialah nilai penting dalam masyarakat aman. 华语：互相尊重。"}, {"type": "mcq", "skill": "Nilai", "q": "Rakyat yang bersyukur hidup dalam negara aman menunjukkan nilai...", "options": ["Kesyukuran", "Kemarahan", "Ketamakan", "Kemalasan"], "ans": 0, "exp": "Nilai yang sesuai ialah kesyukuran. 华语：感恩。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah berusaha mengekalkan kedamaian negara", "Kedamaian", "Patriotisme", "Negara"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat. 华语：启示要写完整行动句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah mencintai dan menghargai...", "options": ["negara yang merdeka", "kekayaan orang lain", "persaingan", "konflik"], "ans": 0, "exp": "Kita perlu menghargai negara yang merdeka. 华语：珍惜独立国家。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah menyelesaikan masalah dengan bijaksana supaya...", "options": ["keamanan dapat dikekalkan", "konflik bertambah", "rakyat berpecah", "negara lemah"], "ans": 0, "exp": "Penyelesaian secara bijaksana membantu mengekalkan keamanan. 华语：智慧解决问题可维护和平。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak Kucari Damai di Sini mempunyai berapa rangkap?", "options": ["2", "3", "4", "5"], "ans": 1, "exp": "Sajak ini mempunyai 3 rangkap. 华语：共有3节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap pertama mempunyai...", "options": ["6 baris", "5 baris", "4 baris", "3 baris"], "ans": 0, "exp": "Rangkap pertama mempunyai 6 baris. 华语：第一节6行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap kedua mempunyai...", "options": ["5 baris", "6 baris", "4 baris", "3 baris"], "ans": 0, "exp": "Rangkap kedua mempunyai 5 baris. 华语：第二节5行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap ketiga mempunyai...", "options": ["4 baris", "5 baris", "6 baris", "2 baris"], "ans": 0, "exp": "Rangkap ketiga mempunyai 4 baris. 华语：第三节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak ini berbentuk...", "options": ["bebas", "syair", "pantun", "gurindam"], "ans": 0, "exp": "Kucari Damai di Sini ialah sajak bebas. 华语：自由诗。"}, {"type": "mcq", "skill": "Bentuk", "q": "Nada sajak ini ialah...", "options": ["patriotik", "jenaka", "romantik", "sinis"], "ans": 0, "exp": "Nada sajak bersifat patriotik. 华语：爱国基调。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan frasa tertentu untuk menegaskan hasrat penyajak disebut...", "options": ["Repetisi", "Metafora", "Simile", "Sinkope"], "ans": 0, "exp": "Repetisi ialah pengulangan frasa atau kata. 华语：重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan bahasa yang dilebih-lebihkan disebut...", "options": ["Hiperbola", "Anafora", "Sinkope", "Personifikasi"], "ans": 0, "exp": "Hiperbola ialah bahasa yang dilebih-lebihkan. 华语：夸张。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Gabungan kata yang membawa makna tersirat disebut...", "options": ["Metafora", "Repetisi", "Anafora", "Aliterasi"], "ans": 0, "exp": "Metafora ialah gabungan kata yang membawa makna tersirat. 华语：隐喻。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Gabungan idea yang kelihatan bertentangan tetapi membawa makna tertentu disebut...", "options": ["Paradoks", "Simile", "Sinkope", "Anafora"], "ans": 0, "exp": "Paradoks menggabungkan idea yang kelihatan bertentangan. 华语：矛盾修辞。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Metafora", "Repetisi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Simile", "Inversi"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Bagaimanakah rakyat boleh membantu mengekalkan kedamaian negara?", "options": ["Saling menghormati, bekerjasama dan menyelesaikan konflik secara matang", "Mementingkan diri", "Menyebarkan kebencian", "Mengabaikan undang-undang"], "ans": 0, "exp": "Saling menghormati, bekerjasama dan menyelesaikan konflik secara matang membantu mengekalkan kedamaian. 华语：互相尊重、合作、理性解决冲突。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Kucari Damai di Sini?", "options": ["Kedamaian negara perlu dipelihara melalui kasih sayang, persaudaraan, jati diri dan semangat patriotik", "Kedamaian hanya tanggungjawab pemerintah", "Kemerdekaan tidak perlu dipertahankan", "Kejayaan negara hanya bergantung pada kekayaan"], "ans": 0, "exp": "Sajak menekankan kedamaian yang dibina melalui perpaduan, jati diri dan patriotisme. 华语：和平来自团结、身份认同和爱国精神。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_kucari_damai_di_sini_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_kucari_damai_di_sini_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
