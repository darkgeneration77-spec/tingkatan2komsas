<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menuai Emas - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · CERPEN</div><h1>Menuai Emas</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Sinopsis", "q": "Siapakah watak utama cerpen Menuai Emas?", "options": ["Alif", "Abang Man", "Tuk Ketua", "Mak Wan"], "ans": 0, "exp": "Watak utama ialah Alif. 华语：主角是 Alif。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah bidang pengajian Alif di universiti?", "options": ["Ekonomi", "Kejuruteraan", "Perubatan", "Undang-undang"], "ans": 0, "exp": "Alif ialah lulusan universiti dalam bidang ekonomi. 华语：Alif 是经济系大学毕业生。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang mahu dilakukan oleh Abang Man dan beberapa pemilik sawah?", "options": ["Menjual tanah kepada syarikat perumahan", "Membina sekolah", "Membuka kilang", "Mengusahakan kebun getah"], "ans": 0, "exp": "Mereka mahu menjual tanah sawah kepada syarikat perumahan. 华语：他们想把稻田卖给房地产公司。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah keputusan Alif terhadap dua petak sawah keluarganya?", "options": ["Enggan menjualnya", "Menjual dengan segera", "Memberikannya kepada syarikat", "Membiarkannya kosong"], "ans": 0, "exp": "Alif enggan menjual dua petak sawah keluarganya. 华语：Alif 拒绝出售家里的两块稻田。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Siapakah yang mempertahankan keputusan Alif?", "options": ["Mak Wan", "Abang Man", "Pegawai bank", "Pemaju"], "ans": 0, "exp": "Mak Wan mempertahankan anaknya. 华语：Mak Wan 支持并维护 Alif 的决定。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Siapakah yang turut memberikan sokongan kepada Alif?", "options": ["Tuk Ketua", "Tuan Binjah", "Nubhan", "Sidek"], "ans": 0, "exp": "Tuk Ketua menyokong usaha Alif. 华语：村长也支持 Alif。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah projek utama yang dirancang Alif?", "options": ["Estet padi mini", "Ladang kelapa sawit", "Penternakan ayam", "Kilang makanan"], "ans": 0, "exp": "Alif merancang projek estet padi mini. 华语：Alif 推动小型集体稻田计划。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Berapa orang pemilik tanah yang akhirnya bersetuju bergabung?", "options": ["10", "12", "15", "20"], "ans": 2, "exp": "Akhirnya 15 orang pemilik tanah bersetuju bergabung. 华语：最终有15名地主加入。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Berapakah keluasan kawasan yang diusahakan secara sistematik?", "options": ["Hampir 60 hektar", "Hampir 20 hektar", "Hampir 100 hektar", "Hampir 10 hektar"], "ans": 0, "exp": "Kawasan yang diusahakan hampir 60 hektar. 华语：面积接近60公顷。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Menuai Emas ialah...", "options": ["Kemajuan bidang pertanian melalui ilmu, usaha dan kaedah moden", "Kasih sayang keluarga sahaja", "Kehidupan nelayan", "Semangat patriotik"], "ans": 0, "exp": "Tema menekankan kemajuan pertanian melalui ilmu, usaha dan teknologi moden. 华语：以知识、努力和现代方法推动农业发展。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam cerpen ini?", "options": ["Lulusan universiti tidak semestinya bekerja makan gaji", "Keindahan alam", "Persaingan sukan", "Kehidupan di laut"], "ans": 0, "exp": "Cerpen menunjukkan graduan boleh memilih bidang keusahawanan dan pertanian. 华语：大学毕业生不一定只能做受薪工作。"}, {"type": "mcq", "skill": "Persoalan", "q": "Muafakat dalam projek estet padi menunjukkan bahawa...", "options": ["kerjasama membawa kejayaan", "persaingan lebih penting", "sikap tamak diperlukan", "usaha individu sahaja mencukupi"], "ans": 0, "exp": "Muafakat membantu menjayakan projek. 华语：合作能带来成功。"}, {"type": "mcq", "skill": "Persoalan", "q": "Cerpen turut menyentuh masalah...", "options": ["Golongan muda kurang berminat dalam pertanian", "Semua petani terlalu kaya", "Tiada tanah pertanian", "Tiada teknologi"], "ans": 0, "exp": "Salah satu persoalan ialah kurangnya minat golongan muda terhadap pertanian. 华语：年轻人对农业兴趣不足。"}, {"type": "mcq", "skill": "Watak", "q": "Apakah sifat utama Alif?", "options": ["Berwawasan dan gigih", "Tamak dan kasar", "Malas dan sombong", "Pengecut dan cuai"], "ans": 0, "exp": "Alif berwawasan, gigih dan berani menghadapi cabaran. 华语：有远见、坚持不懈。"}, {"type": "mcq", "skill": "Watak", "q": "Mak Wan digambarkan sebagai ibu yang...", "options": ["penyayang dan menyokong anak", "tamak dan kasar", "malas dan cuai", "tidak peduli"], "ans": 0, "exp": "Mak Wan penyayang, sabar dan menyokong Alif. 华语：疼爱并支持儿子。"}, {"type": "mcq", "skill": "Watak", "q": "Abang Man pada awalnya...", "options": ["memandang rendah pilihan Alif", "menyokong Alif sepenuhnya", "menjadi pegawai pertanian", "mengusahakan projek bersama Alif"], "ans": 0, "exp": "Abang Man memandang rendah pilihan Alif untuk bertani. 华语：起初轻视 Alif 的农业选择。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peristiwa permulaan cerpen?", "options": ["Alif melihat sawah menguning dan mengenang kata-kata arwah ayahnya", "Alif menjual tanah", "Projek gagal", "Abang Man berpindah"], "ans": 0, "exp": "Cerpen bermula dengan Alif melihat sawah yang menguning. 华语：故事从 Alif 看着金黄稻田开始。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah konflik utama cerpen?", "options": ["Alif mahu mempertahankan sawah sedangkan pihak lain mahu menjual tanah", "Alif mahu meninggalkan keluarga", "Mak Wan mahu menjual rumah", "Tuk Ketua mahu berhenti bertani"], "ans": 0, "exp": "Konflik utama ialah perbezaan pendirian tentang masa depan tanah sawah. 华语：冲突在于保留稻田还是卖给发展商。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peleraian cerpen?", "options": ["Projek estet padi mini berjaya dan sawah sedia dituai", "Semua tanah dijual", "Alif meninggalkan kampung", "Projek dihentikan"], "ans": 0, "exp": "Akhirnya projek berjaya dan sawah menguning sedia dituai. 华语：最后集体稻作计划成功。"}, {"type": "mcq", "skill": "Latar", "q": "Yang manakah latar tempat penting?", "options": ["Sawah padi", "Istana", "Stadium", "Lapangan terbang"], "ans": 0, "exp": "Sawah padi ialah latar utama cerpen. 华语：稻田是主要地点。"}, {"type": "mcq", "skill": "Latar", "q": "Masyarakat dalam cerpen ini termasuk...", "options": ["Masyarakat petani dan golongan muda berpendidikan", "Masyarakat istana", "Masyarakat pelaut", "Masyarakat tentera"], "ans": 0, "exp": "Cerpen memaparkan petani dan golongan muda berpendidikan. 华语：农民与受教育年轻人。"}, {"type": "mcq", "skill": "Nilai", "q": "Alif yang terus berusaha walaupun dipandang rendah menunjukkan nilai...", "options": ["Kegigihan", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Alif menunjukkan kegigihan. 华语：坚持不懈。"}, {"type": "mcq", "skill": "Nilai", "q": "Lima belas pemilik tanah yang bergabung menunjukkan nilai...", "options": ["Kerjasama", "Ketamakan", "Kebencian", "Kesombongan"], "ans": 0, "exp": "Mereka menunjukkan kerjasama. 华语：合作。"}, {"type": "mcq", "skill": "Nilai", "q": "Alif menggunakan ilmu yang dipelajari untuk memajukan pertanian menunjukkan nilai...", "options": ["Rasional", "Malas", "Sombong", "Tamak"], "ans": 0, "exp": "Alif bertindak rasional dengan menggunakan ilmu untuk kemajuan. 华语：理智并善用知识。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah gigih berusaha untuk mencapai kejayaan", "Kegigihan", "Sawah", "Pertanian"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita janganlah memandang rendah bidang...", "options": ["pertanian", "ilmu", "keluarga", "persahabatan"], "ans": 0, "exp": "Cerpen menekankan bahawa pertanian mempunyai potensi besar. 华语：不要轻视农业。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah menggunakan ilmu untuk...", "options": ["memajukan kehidupan dan kerjaya", "menghina orang lain", "mengelak tanggungjawab", "menolak perubahan"], "ans": 0, "exp": "Ilmu perlu digunakan untuk kemajuan diri dan masyarakat. 华语：把知识应用于实际发展。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah golongan muda patut mempertimbangkan bidang pertanian moden?", "options": ["Kerana pertanian boleh menjadi kerjaya berpotensi jika digabungkan dengan ilmu dan teknologi", "Kerana semua kerja lain tidak berguna", "Kerana pertanian tidak memerlukan usaha", "Kerana pertanian sentiasa mudah"], "ans": 0, "exp": "Pertanian moden boleh menjadi kerjaya bernilai apabila digabungkan dengan ilmu dan teknologi. 华语：现代农业结合知识与科技，有发展潜力。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kelebihan menggabungkan tanah dalam projek estet padi mini?", "options": ["Pengurusan lebih sistematik dan penggunaan jentera lebih berkesan", "Semua orang boleh berhenti bekerja", "Tanah menjadi lebih kecil", "Teknologi tidak diperlukan"], "ans": 0, "exp": "Penggabungan tanah memudahkan pengurusan dan penggunaan teknologi. 华语：集中土地可提高管理和机械化效率。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Menuai Emas?", "options": ["Ilmu, usaha, kesabaran, muafakat dan teknologi mampu membawa kejayaan dalam pertanian", "Pertanian hanya sesuai untuk orang tua", "Graduan mesti bekerja makan gaji", "Tanah pertanian lebih baik dijual"], "ans": 0, "exp": "Cerpen menekankan ilmu, usaha, kerjasama dan teknologi sebagai asas kejayaan pertanian. 华语：知识、努力、合作与科技能让农业成功。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_menuai_emas_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_menuai_emas_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
