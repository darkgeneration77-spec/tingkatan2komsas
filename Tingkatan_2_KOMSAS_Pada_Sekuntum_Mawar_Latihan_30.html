<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pada Sekuntum Mawar - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Pada Sekuntum Mawar</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Dalam sajak Pada Sekuntum Mawar, seorang gadis diibaratkan sebagai...", "options": ["sekuntum mawar", "burung merpati", "bulan purnama", "pohon rendang"], "ans": 0, "exp": "Penyajak mengibaratkan gadis sebagai sekuntum mawar. 华语：诗人把少女比作一朵玫瑰。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah yang berlaku kepada ibu jika maruah anak gadisnya tercemar?", "options": ["Ibu berasa amat sedih", "Ibu menjadi gembira", "Ibu berasa bangga", "Ibu tidak peduli"], "ans": 0, "exp": "Ibu akan berasa sangat sedih jika maruah anak gadisnya tercemar. 华语：女儿失去名誉会让母亲非常伤心。"}, {"type": "mcq", "skill": "Maksud", "q": "Kehilangan maruah boleh menyebabkan kehidupan seseorang menjadi...", "options": ["suram", "lebih mudah", "lebih mewah", "lebih bebas"], "ans": 0, "exp": "Kehilangan maruah boleh menjadikan kehidupan suram dan sukar dipulihkan. 华语：失去尊严可能让人生陷入低谷。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah nasihat utama penyajak kepada gadis?", "options": ["Menjaga maruah diri", "Mengejar kekayaan", "Meninggalkan keluarga", "Mengabaikan agama"], "ans": 0, "exp": "Penyajak menasihati gadis supaya menjaga maruah diri. 华语：少女必须保护自己的尊严。"}, {"type": "mcq", "skill": "Maksud", "q": "Keimanan dapat membantu seseorang...", "options": ["menjauhi gejala negatif", "menjadi sombong", "mengabaikan keluarga", "menolak nasihat"], "ans": 0, "exp": "Keimanan membantu seseorang menjauhi perkara negatif. 华语：信仰能帮助远离不良行为。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pada Sekuntum Mawar ialah...", "options": ["Kepentingan menjaga maruah diri agar tidak mencemarkan nama baik diri dan keluarga", "Kasih sayang terhadap alam", "Semangat patriotik", "Kehidupan di bandar"], "ans": 0, "exp": "Tema menekankan kepentingan menjaga maruah diri dan keluarga. 华语：维护个人与家庭名誉。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam sajak ini?", "options": ["Kesedihan ibu apabila maruah anak gadisnya tercemar", "Kehidupan nelayan", "Kemajuan teknologi", "Persaingan sukan"], "ans": 0, "exp": "Kesedihan ibu ialah salah satu persoalan utama sajak. 华语：女儿失去名誉让母亲悲伤。"}, {"type": "mcq", "skill": "Persoalan", "q": "Tindakan seseorang boleh memberi kesan kepada...", "options": ["nama baik keluarga", "cuaca", "harga barang", "warna pakaian"], "ans": 0, "exp": "Perbuatan seseorang boleh menjejaskan nama baik keluarga. 华语：个人行为会影响家庭名誉。"}, {"type": "mcq", "skill": "Persoalan", "q": "Maruah diri perlu dipertahankan ketika menghadapi...", "options": ["cabaran kehidupan", "hiburan", "percutian", "persaingan permainan"], "ans": 0, "exp": "Maruah diri perlu dijaga dalam menghadapi cabaran kehidupan. 华语：面对生活挑战时必须保护尊严。"}, {"type": "mcq", "skill": "Nilai", "q": "Kasih seorang ibu terhadap anak menunjukkan nilai...", "options": ["Kasih sayang", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Hubungan ibu dan anak menunjukkan kasih sayang. 华语：关爱。"}, {"type": "mcq", "skill": "Nilai", "q": "Berfikir dengan waras sebelum membuat keputusan menunjukkan nilai...", "options": ["Rasional", "Tamak", "Sombong", "Malas"], "ans": 0, "exp": "Nilai yang sesuai ialah rasional. 华语：理智。"}, {"type": "mcq", "skill": "Nilai", "q": "Menjaga tingkah laku dan maruah diri menunjukkan nilai...", "options": ["Berhemah tinggi", "Ketamakan", "Keberanian", "Kemalasan"], "ans": 0, "exp": "Berhemah tinggi bermaksud menjaga akhlak dan tingkah laku. 华语：高尚品德。"}, {"type": "mcq", "skill": "Nilai", "q": "Keimanan yang kukuh membantu seseorang...", "options": ["menjaga diri daripada perkara negatif", "mengabaikan nasihat", "menjadi kasar", "mementingkan diri"], "ans": 0, "exp": "Keimanan menjadi benteng daripada gejala negatif. 华语：信仰帮助人远离不良行为。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah menjaga maruah diri", "Maruah", "Ibu", "Mawar"], "ans": 0, "exp": "Pengajaran perlu berbentuk tindakan. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah menjauhi...", "options": ["gejala sosial yang boleh merosakkan masa depan", "ibu bapa", "ilmu pengetahuan", "nasihat baik"], "ans": 0, "exp": "Kita perlu menjauhi gejala sosial yang merosakkan masa depan. 华语：远离不良社会行为。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah menjaga hati dan perasaan...", "options": ["ibu bapa", "orang asing sahaja", "pesaing", "musuh"], "ans": 0, "exp": "Kita perlu menjaga perasaan ibu bapa. 华语：顾及父母的感受。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak Pada Sekuntum Mawar mempunyai berapa rangkap?", "options": ["2", "3", "4", "5"], "ans": 1, "exp": "Sajak ini mempunyai 3 rangkap. 华语：共有3节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap pertama mempunyai...", "options": ["3 baris", "4 baris", "5 baris", "6 baris"], "ans": 0, "exp": "Rangkap pertama mempunyai 3 baris. 华语：第一节3行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap kedua mempunyai...", "options": ["6 baris", "5 baris", "4 baris", "3 baris"], "ans": 0, "exp": "Rangkap kedua mempunyai 6 baris. 华语：第二节6行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap ketiga mempunyai...", "options": ["5 baris", "6 baris", "4 baris", "3 baris"], "ans": 0, "exp": "Rangkap ketiga mempunyai 5 baris. 华语：第三节5行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak ini berbentuk...", "options": ["bebas", "pantun", "syair", "gurindam"], "ans": 0, "exp": "Pada Sekuntum Mawar ialah sajak bebas. 华语：自由诗。"}, {"type": "mcq", "skill": "Bentuk", "q": "Nada sajak ini ialah...", "options": ["melankolik", "jenaka", "patriotik", "romantik ringan"], "ans": 0, "exp": "Nada sajak bersifat melankolik, sedih dan penuh nasihat. 华语：忧郁、悲伤并带劝诫。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "“Lipatan usia” dan “pintu kehidupan” ialah contoh...", "options": ["Metafora", "Simile", "Repetisi", "Anafora"], "ans": 0, "exp": "Frasa seperti itu ialah metafora. 华语：隐喻。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan bentuk singkat seperti “tak” dan “tapi” disebut...", "options": ["Sinkope", "Metafora", "Simile", "Hiperbola"], "ans": 0, "exp": "Sinkope ialah penggunaan bentuk kata singkat. 华语：缩略。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Memberikan sifat manusia kepada unsur bukan manusia disebut...", "options": ["Personifikasi", "Repetisi", "Anafora", "Inversi"], "ans": 0, "exp": "Personifikasi = memberikan sifat manusia kepada unsur bukan manusia. 华语：拟人。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Mawar, malam, angin, laut, ombak dan lembah termasuk...", "options": ["Unsur alam", "Hiperbola", "Sinkope", "Inversi"], "ans": 0, "exp": "Itu ialah unsur alam. 华语：自然元素。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Repetisi", "Anafora"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah remaja perlu menjaga maruah diri?", "options": ["Kerana tindakan mereka boleh mempengaruhi masa depan dan nama baik keluarga", "Kerana semua orang akan menjadi kaya", "Kerana maruah hanya penting di sekolah", "Kerana ia menghapus semua masalah"], "ans": 0, "exp": "Maruah berkait dengan masa depan, harga diri dan nama baik keluarga. 华语：尊严关系到未来和家庭名誉。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan terbaik apabila berhadapan tekanan rakan sebaya?", "options": ["Berpegang pada prinsip dan menolak perkara yang salah", "Mengikut sahaja", "Menyembunyikan semuanya", "Membalas dengan kasar"], "ans": 0, "exp": "Jati diri yang kuat membantu seseorang menolak pengaruh negatif. 华语：坚持原则，拒绝错误行为。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pada Sekuntum Mawar?", "options": ["Gadis mesti menjaga maruah diri kerana kehilangan maruah boleh melukakan keluarga dan merosakkan masa depan", "Rupa paras lebih penting daripada akhlak", "Keluarga tidak terkesan oleh perbuatan seseorang", "Iman tidak berkaitan dengan tingkah laku"], "ans": 0, "exp": "Sajak menekankan maruah, iman, jati diri dan kesan perbuatan terhadap keluarga. 华语：维护尊严、信仰与家庭名誉。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pada_sekuntum_mawar_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pada_sekuntum_mawar_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
