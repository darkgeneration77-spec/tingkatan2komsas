<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantun Budi - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Pantun Budi</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah maksud utama rangkap yang menyatakan budi akan sentiasa dikenang?", "options": ["Kebaikan seseorang akan terus diingati", "Harta seseorang akan diwarisi", "Rupa seseorang menentukan maruah", "Kekayaan menjadikan seseorang dihormati"], "ans": 0, "exp": "Budi yang baik akan sentiasa dikenang dan disebut orang. 华语：一个人的恩德与善行会被长期记住。"}, {"type": "mcq", "skill": "Maksud", "q": "Orang yang baik mempunyai...", "options": ["harta yang banyak", "budi bahasa yang tinggi", "kuasa yang besar", "rupa yang cantik"], "ans": 1, "exp": "Pantun menekankan bahawa orang baik memiliki budi bahasa yang tinggi. 华语：真正优秀的人拥有良好品德和礼貌。"}, {"type": "mcq", "skill": "Maksud", "q": "Orang yang tidak berbudi bahasa akan...", "options": ["dipandang mulia", "dipandang hina", "menjadi kaya", "menjadi pemimpin"], "ans": 1, "exp": "Orang yang tidak berbudi bahasa akan dipandang hina. 华语：没有礼貌和品德的人会被社会轻视。"}, {"type": "mcq", "skill": "Maksud", "q": "Dalam kehidupan, ada manusia yang lebih mengutamakan...", "options": ["budi bahasa daripada harta", "harta kekayaan daripada budi bahasa", "ilmu daripada keluarga", "alam daripada bahasa"], "ans": 1, "exp": "Pantun menyindir manusia yang lebih mementingkan kekayaan daripada budi bahasa. 华语：有些人把财富看得比品德更重要。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pantun Budi ialah...", "options": ["Budi bahasa mencerminkan martabat seseorang dan bangsa", "Kehidupan nelayan", "Keberanian di medan perang", "Kasih sayang terhadap alam"], "ans": 0, "exp": "Tema menekankan nilai budi bahasa dan hubungannya dengan martabat individu serta bangsa. 华语：品德与语言反映个人和民族的修养。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam Pantun Budi?", "options": ["Orang yang tidak berbudi bahasa dipandang hina", "Kehidupan di sekolah", "Kemajuan teknologi", "Persaingan sukan"], "ans": 0, "exp": "Ini merupakan salah satu persoalan utama pantun. 华语：缺乏礼貌会被社会轻视。"}, {"type": "mcq", "skill": "Persoalan", "q": "Ketinggian darjat sesuatu bangsa dinilai daripada...", "options": ["bahasa yang dituturkan", "jumlah kekayaan", "saiz negara", "bilangan penduduk"], "ans": 0, "exp": "Bahasa dan tutur kata mencerminkan martabat bangsa. 华语：一个民族的修养可从语言与谈吐看出。"}, {"type": "mcq", "skill": "Persoalan", "q": "Sikap mementingkan kekayaan boleh menyebabkan seseorang...", "options": ["lupa akan nilai budi bahasa", "lebih sabar", "lebih rajin", "lebih berani"], "ans": 0, "exp": "Terlalu mengejar kekayaan boleh menyebabkan nilai budi bahasa diabaikan. 华语：过度重视财富会忽略品德。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai utama Pantun Budi ialah...", "options": ["Berbudi bahasa", "Keberanian", "Keadilan", "Kerajinan"], "ans": 0, "exp": "Nilai teras pantun ialah berbudi bahasa. 华语：核心价值观是有礼貌、有品德。"}, {"type": "mcq", "skill": "Nilai", "q": "Mengingati jasa orang lain menunjukkan nilai...", "options": ["Mengenang jasa", "Berdikari", "Rasional", "Ketegasan"], "ans": 0, "exp": "Mengenang jasa bermaksud tidak melupakan bantuan dan kebaikan orang lain. 华语：铭记恩情。"}, {"type": "mcq", "skill": "Nilai", "q": "Menggunakan fikiran dengan baik dalam membuat keputusan menunjukkan nilai...", "options": ["Kebijaksanaan", "Kesombongan", "Ketamakan", "Kemarahan"], "ans": 0, "exp": "Kebijaksanaan ialah keupayaan berfikir dan bertindak dengan baik. 华语：智慧。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah mengamalkan budi bahasa", "Budi bahasa", "Kekayaan", "Bahasa"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat lengkap. 华语：Pengajaran 要写“我们应该怎样做”。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah mengenang jasa orang yang...", "options": ["telah berbudi kepada kita", "lebih kaya daripada kita", "tinggal jauh daripada kita", "lebih tua sahaja"], "ans": 0, "exp": "Jasa dan budi orang lain hendaklah dikenang. 华语：应该铭记曾帮助过我们的人。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah mengutamakan budi bahasa berbanding...", "options": ["harta kekayaan", "keluarga", "ilmu", "kesihatan"], "ans": 0, "exp": "Pantun menekankan budi bahasa lebih bernilai daripada kekayaan. 华语：品德应比财富更重要。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Budi mempunyai berapa rangkap?", "options": ["5", "7", "10", "17"], "ans": 1, "exp": "Pantun Budi mempunyai 7 rangkap. 华语：共有7节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Setiap rangkap Pantun Budi mempunyai...", "options": ["2 baris", "3 baris", "4 baris", "6 baris"], "ans": 2, "exp": "Setiap rangkap mempunyai 4 baris. 华语：每节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Budi tergolong sebagai pantun...", "options": ["terikat", "bebas sepenuhnya", "tanpa rima", "tanpa pembayang"], "ans": 0, "exp": "Pantun Budi ialah pantun terikat. 华语：属于固定结构的传统诗。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan yang sama pada awal baris disebut...", "options": ["Anafora", "Simile", "Metafora", "Sinkope"], "ans": 0, "exp": "Anafora ialah pengulangan perkataan pada awal baris. 华语：首语重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan unsur seperti air, laut, tanjung dan bunga termasuk...", "options": ["Unsur alam", "Metafora", "Hiperbola", "Inversi"], "ans": 0, "exp": "Itu ialah penggunaan unsur alam. 华语：自然元素。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Memberikan sifat manusia kepada sesuatu yang bukan manusia disebut...", "options": ["Personifikasi", "Repetisi", "Anafora", "Peribahasa"], "ans": 0, "exp": "Personifikasi = memberikan sifat manusia kepada benda bukan manusia. 华语：拟人。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan dalam rangkap atau antara rangkap disebut...", "options": ["Repetisi", "Simile", "Metafora", "Sinkope"], "ans": 0, "exp": "Repetisi ialah pengulangan perkataan. 华语：重复。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Anafora", "Responsi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Inversi", "Metafora"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah budi bahasa penting dalam masyarakat?", "options": ["Kerana budi bahasa membantu mewujudkan hubungan yang saling menghormati", "Kerana budi bahasa menjadikan seseorang kaya", "Kerana budi bahasa menjadikan seseorang terkenal", "Kerana budi bahasa menggantikan ilmu"], "ans": 0, "exp": "Budi bahasa mewujudkan hubungan yang baik dan saling menghormati. 华语：品德和礼貌能建立和谐关系。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan jika seseorang hanya mementingkan harta?", "options": ["Dia mungkin mengabaikan nilai kemanusiaan dan budi bahasa", "Dia pasti menjadi bijaksana", "Dia sentiasa dihormati", "Dia tidak akan menghadapi masalah"], "ans": 0, "exp": "Terlalu mengejar harta boleh menyebabkan nilai kemanusiaan terabai. 华语：过度追逐财富可能忽略人情与品德。"}, {"type": "mcq", "skill": "KBAT", "q": "Bagaimanakah cara menjaga martabat bangsa melalui bahasa?", "options": ["Menggunakan bahasa dengan sopan dan betul", "Menghina bahasa sendiri", "Menggunakan bahasa kasar", "Mengelakkan komunikasi"], "ans": 0, "exp": "Bahasa yang sopan dan baik mencerminkan martabat bangsa. 华语：正确、礼貌地使用语言能体现民族修养。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan terbaik apabila menerima bantuan daripada orang lain?", "options": ["Mengenang jasa dan berterima kasih", "Melupakannya segera", "Menganggap bantuan itu kewajipan", "Menghina orang tersebut"], "ans": 0, "exp": "Mengenang jasa dan berterima kasih ialah tindakan yang betul. 华语：要感恩并铭记帮助。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah kecantikan fizikal sahaja tidak mencukupi?", "options": ["Kerana keperibadian dan budi bahasa lebih menentukan nilai seseorang", "Kerana semua orang mesti kaya", "Kerana rupa tidak penting langsung", "Kerana bahasa lebih mahal"], "ans": 0, "exp": "Nilai seseorang banyak bergantung pada sikap dan budi bahasa. 华语：真正价值来自品格，不只是外表。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pantun Budi?", "options": ["Budi bahasa dan tutur kata lebih bernilai daripada kekayaan semata-mata", "Kekayaan ialah tujuan utama hidup", "Rupa paras menentukan maruah", "Bahasa tidak penting"], "ans": 0, "exp": "Pantun Budi menekankan bahawa budi bahasa dan tutur kata sangat penting. 华语：品德和语言比单纯财富更重要。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Kata kunci paling sesuai untuk Pantun Budi ialah...", "options": ["budi bahasa, mengenang jasa, martabat bangsa, tutur kata", "sukan, sekolah, hadiah, peperiksaan", "laut, ribut, kapal, nelayan", "hutan, haiwan, pemburuan, sungai"], "ans": 0, "exp": "Kata kunci utama ialah budi bahasa, jasa, martabat bangsa dan tutur kata. 华语：品德、恩情、民族尊严、谈吐。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pantun_budi_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pantun_budi_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
