<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantun Kasih Sayang - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Pantun Kasih Sayang</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah yang menyebabkan wajah seseorang kelihatan berseri-seri dalam Pantun Kasih Sayang?", "options": ["Senyuman yang menawan", "Harta yang banyak", "Pakaian yang mahal", "Kedudukan yang tinggi"], "ans": 0, "exp": "Wajah kelihatan berseri-seri kerana senyuman yang menawan. 华语：迷人的笑容让脸显得有光彩。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah yang berlaku apabila seseorang meletakkan harapan terlalu tinggi terhadap orang yang disukainya?", "options": ["Harapan mungkin tidak kesampaian", "Dia pasti berjaya", "Dia menjadi lebih kaya", "Dia tidak akan kecewa"], "ans": 0, "exp": "Jika tersilap perhitungan, harapan yang terlalu tinggi mungkin tidak kesampaian. 华语：判断错误时，过高期望可能落空。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah impian yang digambarkan dalam salah satu rangkap?", "options": ["Mendapat wanita yang sangat cantik", "Menjadi pemerintah", "Membina rumah besar", "Mengembara ke luar negara"], "ans": 0, "exp": "Pantun menggambarkan impian mendapatkan seorang wanita yang cantik dan tiada bandingannya. 华语：希望得到非常美丽的女子。"}, {"type": "mcq", "skill": "Maksud", "q": "Mengapakah seseorang berpura-pura dalam salah satu rangkap?", "options": ["Untuk mendekati dan memikat gadis", "Untuk mendapatkan pekerjaan", "Untuk menipu keluarga", "Untuk mengelakkan tanggungjawab"], "ans": 0, "exp": "Seseorang berpura-pura untuk mendekati dan memikat anak gadis orang. 华语：为了接近并吸引喜欢的女子。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah maksud rangkap terakhir?", "options": ["Orang yang berjodoh akan bertemu juga walaupun pernah berpisah", "Perpisahan sentiasa kekal", "Cinta tidak penting", "Jodoh boleh dibeli"], "ans": 0, "exp": "Rangkap terakhir menekankan bahawa orang yang berjodoh akan bertemu juga. 华语：有缘的人即使分开，仍可能再相遇。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pantun Kasih Sayang ialah...", "options": ["Kasih sayang antara teruna dengan dara yang menghadapi pelbagai halangan", "Kasih sayang ibu bapa", "Semangat patriotik", "Keindahan alam"], "ans": 0, "exp": "Tema ialah kasih sayang antara teruna dengan dara yang berdepan halangan. 华语：男女之间的爱情与阻碍。"}, {"type": "mcq", "skill": "Persoalan", "q": "Perbezaan darjat boleh...", "options": ["menghalang impian seseorang", "menjamin kejayaan", "menghapus perasaan", "menambah kekayaan"], "ans": 0, "exp": "Perbezaan darjat boleh menjadi halangan kepada impian dan hubungan. 华语：身份差异可能成为感情阻碍。"}, {"type": "mcq", "skill": "Persoalan", "q": "Sanggup berpura-pura untuk mencapai sesuatu tujuan menunjukkan persoalan...", "options": ["muslihat dalam mencapai tujuan", "kejujuran mutlak", "keberanian dalam peperangan", "kerajinan belajar"], "ans": 0, "exp": "Pantun menyentuh sikap berpura-pura atau menggunakan muslihat. 华语：为了目的而使用计谋。"}, {"type": "mcq", "skill": "Persoalan", "q": "Perpisahan tidak semestinya...", "options": ["berlaku selama-lamanya", "menyedihkan", "dielakkan", "membawa perubahan"], "ans": 0, "exp": "Pantun menunjukkan perpisahan tidak semestinya kekal. 华语：分离不一定代表永远。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai paling utama dalam pantun ini ialah...", "options": ["Kasih sayang", "Keberanian", "Keadilan", "Kerajinan"], "ans": 0, "exp": "Nilai terasnya ialah kasih sayang. 华语：核心价值观是关爱与爱情。"}, {"type": "mcq", "skill": "Nilai", "q": "Berfikir sebelum meletakkan harapan terlalu tinggi menunjukkan nilai...", "options": ["Rasional", "Sombong", "Tamak", "Malas"], "ans": 0, "exp": "Nilai rasional penting supaya seseorang tidak bertindak berdasarkan perasaan semata-mata. 华语：理智。"}, {"type": "mcq", "skill": "Nilai", "q": "Kesetiaan penting ketika...", "options": ["berlaku perpisahan", "mendapat kekayaan", "bertanding", "bermain"], "ans": 0, "exp": "Kesetiaan diuji apabila berlaku perpisahan. 华语：分离时更体现忠诚。"}, {"type": "mcq", "skill": "Nilai", "q": "Perasaan dan tindakan yang lahir daripada hati yang tulus menunjukkan nilai...", "options": ["Keikhlasan", "Ketegasan", "Keberanian", "Kerajinan"], "ans": 0, "exp": "Keikhlasan bermaksud tulus dan jujur dalam perasaan serta tindakan. 华语：真诚。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah menyayangi sesama insan", "Kasih sayang", "Jodoh", "Harapan"], "ans": 0, "exp": "Pengajaran mesti dalam bentuk tindakan. 华语：启示要写完整行动句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah berfikir secara rasional sebelum...", "options": ["meletakkan harapan terhadap sesuatu", "menghina orang", "membalas dendam", "meninggalkan keluarga"], "ans": 0, "exp": "Kita perlu rasional sebelum meletakkan harapan. 华语：抱有期望前要理性衡量。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah ikhlas dalam...", "options": ["perasaan dan perbuatan", "menyembunyikan kesalahan", "menipu orang lain", "memaksa orang"], "ans": 0, "exp": "Pantun menekankan keikhlasan dalam perasaan dan perbuatan. 华语：感情与行为都应真诚。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Kasih Sayang mempunyai berapa rangkap?", "options": ["3", "5", "7", "10"], "ans": 1, "exp": "Pantun Kasih Sayang mempunyai 5 rangkap. 华语：共有5节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Setiap rangkap Pantun Kasih Sayang mempunyai...", "options": ["2 baris", "3 baris", "4 baris", "6 baris"], "ans": 2, "exp": "Setiap rangkap mempunyai 4 baris. 华语：每节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rima akhir Pantun Kasih Sayang ialah...", "options": ["abab", "aaaa", "aabb", "bebas"], "ans": 0, "exp": "Rima akhir pantun ini ialah abab. 华语：尾韵为 abab。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Kasih Sayang ialah puisi yang...", "options": ["terikat", "bebas", "tanpa rima", "tanpa pembayang"], "ans": 0, "exp": "Pantun ialah bentuk puisi tradisional yang terikat. 华语：属于固定格式传统诗。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan buah, langit, bulan, bintang, ayam, ikan dan laut termasuk...", "options": ["Imej alam", "Hiperbola", "Sinkope", "Inversi"], "ans": 0, "exp": "Itu ialah imej atau unsur alam. 华语：自然意象。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Memberikan perlakuan manusia kepada unsur bukan manusia disebut...", "options": ["Personifikasi", "Simile", "Repetisi", "Metafora"], "ans": 0, "exp": "Personifikasi ialah pemberian sifat manusia kepada unsur bukan manusia. 华语：拟人。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Perbandingan langsung menggunakan kata seperti “bagaikan” disebut...", "options": ["Simile", "Metafora", "Hiperbola", "Anafora"], "ans": 0, "exp": "Simile menggunakan kata pembanding seperti bagaikan. 华语：明喻。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Dua idea yang kelihatan bertentangan dalam satu ungkapan disebut...", "options": ["Paradoks", "Repetisi", "Personifikasi", "Sinkope"], "ans": 0, "exp": "Paradoks menggabungkan dua idea yang kelihatan bertentangan. 华语：矛盾修辞。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Anafora", "Repetisi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Metafora", "Inversi"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah seseorang perlu bersikap rasional dalam hubungan?", "options": ["Supaya tidak membuat keputusan hanya berdasarkan emosi", "Supaya boleh mengawal orang lain", "Supaya semua orang bersetuju", "Supaya tidak perlu berkomunikasi"], "ans": 0, "exp": "Sikap rasional membantu seseorang mengelakkan keputusan terburu-buru. 华语：理智能避免只靠情绪做决定。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan terbaik apabila hubungan menghadapi halangan?", "options": ["Berkomunikasi dengan jujur dan menilai keadaan secara matang", "Terus menipu", "Memaksa orang lain", "Menyalahkan semua pihak"], "ans": 0, "exp": "Komunikasi jujur dan penilaian matang ialah tindakan lebih rasional. 华语：诚实沟通并成熟判断。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah keikhlasan penting dalam hubungan?", "options": ["Kerana ia membina kepercayaan", "Kerana ia menjadikan seseorang kaya", "Kerana ia menghapus semua masalah", "Kerana ia menggantikan komunikasi"], "ans": 0, "exp": "Keikhlasan membantu membina kepercayaan antara manusia. 华语：真诚能建立信任。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pantun Kasih Sayang?", "options": ["Kasih sayang perlu disertai keikhlasan, kesetiaan dan pemikiran yang rasional", "Cinta mesti memaksa orang lain", "Perpisahan sentiasa kekal", "Rupa paras lebih penting daripada sikap"], "ans": 0, "exp": "Pantun menekankan kasih sayang yang matang, ikhlas dan rasional. 华语：感情需要真诚、忠诚和理智。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pantun_kasih_sayang_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pantun_kasih_sayang_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
