<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantun Kiasan - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Pantun Kiasan</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah maksud utama rangkap yang menasihati supaya tidak membazir?", "options": ["Pembaziran membawa kerugian", "Pembaziran menunjukkan keberanian", "Pembaziran menjadikan seseorang kaya", "Pembaziran perlu diamalkan"], "ans": 0, "exp": "Perbuatan membazir merupakan amalan yang merugikan. 华语：浪费会给自己带来损失。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah sikap yang perlu diamalkan apabila berada di tempat orang?", "options": ["Sombong", "Merendah diri", "Mementingkan diri", "Berlawan"], "ans": 1, "exp": "Orang yang merantau hendaklah merendah diri. 华语：身处他乡应保持谦虚。"}, {"type": "mcq", "skill": "Maksud", "q": "Sebelum menginginkan sesuatu yang sukar dicapai, kita perlu...", "options": ["menilai kemampuan diri", "meminta orang lain melakukannya", "membesar-besarkan cita-cita", "mengabaikan risiko"], "ans": 0, "exp": "Kita perlu mengetahui kemampuan diri terlebih dahulu. 华语：先衡量自己的能力。"}, {"type": "mcq", "skill": "Maksud", "q": "“Jangan terlalu mengharapkan sesuatu yang belum pasti” bermaksud...", "options": ["jangan terlalu yakin terhadap perkara yang belum tentu berlaku", "jangan belajar perkara baharu", "jangan berusaha", "jangan membantu orang"], "ans": 0, "exp": "Harapan terhadap perkara yang belum pasti perlu dikawal. 华语：不要过度期待还没确定的事情。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pantun Kiasan ialah...", "options": ["Sindiran terhadap sikap negatif manusia", "Kasih sayang ibu bapa", "Keindahan alam", "Semangat patriotik"], "ans": 0, "exp": "Pantun Kiasan menyindir sikap negatif manusia yang boleh memudaratkan diri dan orang lain. 华语：讽刺人类的不良行为。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam Pantun Kiasan?", "options": ["Kesabaran dapat melenyapkan kemarahan", "Keindahan bandar raya", "Kehidupan nelayan", "Persaingan dalam sukan"], "ans": 0, "exp": "Kesabaran yang dapat meredakan kemarahan ialah salah satu persoalan. 华语：耐心能平息愤怒。"}, {"type": "mcq", "skill": "Persoalan", "q": "“Sifat malas sejak kecil sukar diubah apabila dewasa” berkaitan dengan persoalan...", "options": ["kerajinan", "kemalasan", "keberanian", "kejujuran"], "ans": 1, "exp": "Pantun menegur sikap malas yang sukar diubah jika sudah menjadi kebiasaan. 华语：懒惰习惯一旦形成很难改变。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kecantikan tidak bernilai tanpa...", "options": ["harta", "budi bahasa", "kuasa", "pakaian mahal"], "ans": 1, "exp": "Rupa paras yang cantik tidak bernilai jika seseorang tidak berbudi bahasa. 华语：外表再漂亮，没有礼貌也没有真正价值。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang sesuai dengan sikap mengelakkan pembaziran ialah...", "options": ["Berjimat cermat", "Keberanian", "Ketegasan", "Kepatuhan"], "ans": 0, "exp": "Mengelakkan pembaziran menunjukkan nilai berjimat cermat. 华语：节俭。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang ditunjukkan apabila seseorang mengawal kemarahan ialah...", "options": ["Kesabaran", "Kesombongan", "Ketamakan", "Keberanian"], "ans": 0, "exp": "Mengawal kemarahan berkait dengan nilai kesabaran. 华语：耐心。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang berkaitan dengan tidak bersikap sombong ialah...", "options": ["Merendah diri", "Berdendam", "Tamak", "Malas"], "ans": 0, "exp": "Merendah diri ialah lawan kepada sikap sombong. 华语：谦虚。"}, {"type": "mcq", "skill": "Nilai", "q": "Menyedari kesalahan dan mahu membetulkannya menunjukkan nilai...", "options": ["Keinsafan", "Kekayaan", "Keberanian", "Kegembiraan"], "ans": 0, "exp": "Keinsafan = menyedari kesalahan dan mahu berubah. 华语：醒悟。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Ayat manakah pengajaran yang sesuai?", "options": ["Kita hendaklah mengelakkan pembaziran", "Pembaziran", "Sombong", "Budi bahasa"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan. 华语：要写“我们应该怎样做”。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah bersabar untuk...", "options": ["mengawal kemarahan", "menjadi sombong", "menambah pembaziran", "menghina orang"], "ans": 0, "exp": "Kesabaran membantu mengawal kemarahan. 华语：耐心能帮助控制愤怒。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah berbudi bahasa supaya...", "options": ["dihormati masyarakat", "ditakuti semua orang", "menjadi kaya", "dapat berbohong"], "ans": 0, "exp": "Budi bahasa menjadikan seseorang dihormati. 华语：良好品德让人获得尊重。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Kiasan mempunyai berapa rangkap?", "options": ["5", "7", "17", "18"], "ans": 2, "exp": "Pantun Kiasan mempunyai 17 rangkap. 华语：共有17节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Setiap rangkap Pantun Kiasan mempunyai...", "options": ["2 baris", "3 baris", "4 baris", "5 baris"], "ans": 2, "exp": "Setiap rangkap terdiri daripada 4 baris. 华语：每节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Kiasan ialah pantun yang...", "options": ["terikat", "bebas sepenuhnya", "tiada pembayang", "tiada rima"], "ans": 0, "exp": "Pantun Kiasan ialah pantun terikat. 华语：属于固定结构的传统诗歌。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Inversi", "Repetisi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Simile", "Metafora"], "ans": 1, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan bahasa yang dilebih-lebihkan disebut...", "options": ["Hiperbola", "Sinkope", "Inversi", "Repetisi"], "ans": 0, "exp": "Hiperbola ialah bahasa yang dilebih-lebihkan. 华语：夸张。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Susunan kata yang diterbalikkan disebut...", "options": ["Inversi", "Personifikasi", "Anafora", "Metafora"], "ans": 0, "exp": "Inversi = susunan kata diterbalikkan. 华语：倒装。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Dalam soalan gaya bahasa, jawapan paling lengkap ialah...", "options": ["Nama gaya bahasa sahaja", "Nama gaya bahasa + bukti teks", "Tema + nilai", "Bukti tanpa nama gaya bahasa"], "ans": 1, "exp": "Jawapan lengkap perlu ada nama gaya bahasa dan bukti daripada teks. 华语：修辞名称 + 文本证据。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan sikap sombong dalam kehidupan bermasyarakat?", "options": ["Hubungan menjadi renggang", "Semua orang menghormati kita", "Masalah terus hilang", "Kita menjadi lebih sabar"], "ans": 0, "exp": "Sikap sombong boleh menyebabkan orang lain menjauh. 华语：骄傲会破坏人际关系。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah kita perlu mengetahui kemampuan diri sebelum mengejar sesuatu?", "options": ["Supaya dapat membuat keputusan yang realistik", "Supaya tidak perlu berusaha", "Supaya boleh menghina orang lain", "Supaya semua orang ikut kita"], "ans": 0, "exp": "Menilai kemampuan diri membantu membuat keputusan yang lebih realistik. 华语：先衡量能力，才能现实地做决定。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah cara terbaik untuk mengawal kemarahan?", "options": ["Bertenang dan berfikir sebelum bertindak", "Membalas dengan lebih marah", "Menjerit kepada semua orang", "Menyalahkan orang lain"], "ans": 0, "exp": "Bertenang dan berfikir membantu mengawal kemarahan. 华语：先冷静再行动。"}, {"type": "mcq", "skill": "KBAT", "q": "Jika seseorang berjaya sedikit, apakah sikap yang paling sesuai?", "options": ["Bersyukur dan terus berusaha", "Membesar-besarkan kejayaan", "Memandang rendah orang lain", "Berhenti belajar"], "ans": 0, "exp": "Kejayaan kecil patut disyukuri tanpa bersikap sombong. 华语：小成就要感恩并继续努力。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah budi bahasa lebih penting daripada rupa paras?", "options": ["Kerana budi bahasa mencerminkan keperibadian", "Kerana rupa tidak pernah berubah", "Kerana semua orang mesti cantik", "Kerana budi bahasa menjadikan seseorang kaya"], "ans": 0, "exp": "Budi bahasa mencerminkan peribadi dan cara seseorang melayan orang lain. 华语：品德反映真正的人格。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pantun Kiasan?", "options": ["Manusia perlu menjauhi sikap negatif dan memperbaiki diri", "Manusia perlu mengejar kekayaan", "Manusia perlu sentiasa menang", "Manusia tidak perlu menerima nasihat"], "ans": 0, "exp": "Pantun Kiasan menyindir sikap negatif dan menasihati manusia supaya memperbaiki diri. 华语：远离不良态度，改进自己。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Kata kunci yang paling sesuai untuk Pantun Kiasan ialah...", "options": ["membazir, sombong, malas, sabar, budi bahasa", "sekolah, sukan, peperiksaan, hadiah", "laut, nelayan, kapal, ribut", "merdeka, negara, tentera, bendera"], "ans": 0, "exp": "Kata kunci utama berkaitan sikap negatif dan nasihat: membazir, sombong, malas, sabar, budi bahasa. 华语：浪费、骄傲、懒惰、耐心、礼貌。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pantun_kiasan_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pantun_kiasan_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
