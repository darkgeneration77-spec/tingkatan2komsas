<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantun Nasihat - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Pantun Nasihat</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah nasihat utama dalam rangkap pertama Pantun Nasihat?", "options": ["Melakukan kebaikan dan menjauhi kejahatan", "Mengejar kekayaan", "Membalas dendam", "Mengabaikan nasihat"], "ans": 0, "exp": "Rangkap pertama menasihati kita supaya melakukan kebaikan dan menjauhi kejahatan. 华语：行善避恶。"}, {"type": "mcq", "skill": "Maksud", "q": "Mengapakah seseorang perlu mengelakkan perkara yang haram?", "options": ["Kerana boleh membawa kemudaratan", "Kerana menjadikan seseorang terkenal", "Kerana mudah dilakukan", "Kerana semua orang melakukannya"], "ans": 0, "exp": "Perbuatan haram membawa kemudaratan. 华语：被禁止或不正当的行为会带来伤害。"}, {"type": "mcq", "skill": "Maksud", "q": "Kesedihan dan kerisauan tidak seharusnya...", "options": ["dibiarkan berpanjangan", "dikongsi", "dikawal", "difahami"], "ans": 0, "exp": "Kesedihan dan kerisauan yang berpanjangan boleh memudaratkan diri. 华语：不要长期沉浸在悲伤和忧虑中。"}, {"type": "mcq", "skill": "Maksud", "q": "Kita perlu berhati-hati ketika bercakap supaya...", "options": ["tidak tersalah kata dan menanggung akibat buruk", "dapat bercakap lebih kuat", "orang takut kepada kita", "dapat menyalahkan orang lain"], "ans": 0, "exp": "Pantun menasihati kita supaya berhati-hati ketika bertutur. 华语：说话谨慎，避免祸从口出。"}, {"type": "mcq", "skill": "Maksud", "q": "Suami isteri hendaklah saling memahami agar...", "options": ["rumah tangga kekal harmoni", "lebih kaya", "tidak perlu bekerja", "semua orang takut"], "ans": 0, "exp": "Persefahaman suami isteri membantu mengekalkan keharmonian rumah tangga. 华语：夫妻互相理解才能维持家庭和谐。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pantun Nasihat ialah...", "options": ["Nasihat untuk melakukan kebaikan dan menjauhi keburukan", "Keindahan alam", "Kasih sayang terhadap haiwan", "Semangat perjuangan"], "ans": 0, "exp": "Tema utama ialah nasihat sebagai panduan hidup agar melakukan kebaikan dan menjauhi keburukan. 华语：以劝告作为生活准则，行善避恶。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam Pantun Nasihat?", "options": ["Berhati-hati ketika bertutur", "Kehidupan nelayan", "Kemajuan teknologi", "Persaingan akademik"], "ans": 0, "exp": "Berhati-hati ketika bertutur ialah salah satu persoalan. 华语：说话要谨慎。"}, {"type": "mcq", "skill": "Persoalan", "q": "Persefahaman antara suami isteri dapat...", "options": ["menjamin kerukunan rumah tangga", "menambah konflik", "mengurangkan kasih sayang", "menghapus tanggungjawab"], "ans": 0, "exp": "Persefahaman membantu menjamin kerukunan rumah tangga. 华语：互相理解能维护家庭和谐。"}, {"type": "mcq", "skill": "Nilai", "q": "Sentiasa melakukan perkara yang baik menunjukkan nilai...", "options": ["Baik hati", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Melakukan kebaikan menunjukkan nilai baik hati. 华语：善良。"}, {"type": "mcq", "skill": "Nilai", "q": "Berfikir sebelum bercakap atau bertindak menunjukkan nilai...", "options": ["Berhati-hati", "Berani", "Tamak", "Malas"], "ans": 0, "exp": "Nilai yang sesuai ialah berhati-hati. 华语：谨慎。"}, {"type": "mcq", "skill": "Nilai", "q": "Suami isteri yang saling memahami menunjukkan nilai...", "options": ["Kasih sayang", "Keadilan", "Ketegasan", "Keberanian"], "ans": 0, "exp": "Saling memahami dalam keluarga berkait dengan kasih sayang. 华语：关爱。"}, {"type": "mcq", "skill": "Nilai", "q": "Menjaga tutur kata dan kelakuan dalam masyarakat menunjukkan nilai...", "options": ["Berbudi bahasa", "Kesombongan", "Ketamakan", "Berdendam"], "ans": 0, "exp": "Menjaga tutur kata menunjukkan nilai berbudi bahasa. 华语：有礼貌、有品德。"}, {"type": "mcq", "skill": "Nilai", "q": "Membuat keputusan yang baik dan tidak membiarkan emosi menguasai diri menunjukkan nilai...", "options": ["Rasional", "Malas", "Sombong", "Tamak"], "ans": 0, "exp": "Berfikir secara rasional membantu seseorang membuat keputusan yang baik. 华语：理智。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah sentiasa melakukan kebaikan", "Kebaikan", "Baik hati", "Nasihat"], "ans": 0, "exp": "Pengajaran perlu berbentuk ayat tindakan. 华语：启示要写“我们应该怎样做”。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah menghindari perbuatan yang...", "options": ["haram dan memudaratkan", "baik dan berguna", "sopan", "membantu orang"], "ans": 0, "exp": "Kita perlu menghindari perbuatan haram dan memudaratkan. 华语：远离有害和被禁止的行为。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah mengawal kesedihan dan kerisauan agar...", "options": ["tidak memudaratkan diri", "menjadi lebih marah", "dapat menyalahkan orang lain", "tidak perlu berfikir"], "ans": 0, "exp": "Emosi negatif yang berpanjangan boleh memudaratkan diri. 华语：要控制悲伤与忧虑。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Nasihat mempunyai berapa rangkap?", "options": ["5", "7", "10", "17"], "ans": 1, "exp": "Pantun Nasihat mempunyai 7 rangkap. 华语：共有7节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Setiap rangkap Pantun Nasihat mempunyai...", "options": ["2 baris", "3 baris", "4 baris", "6 baris"], "ans": 2, "exp": "Setiap rangkap mempunyai 4 baris. 华语：每节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Pantun Nasihat ialah pantun...", "options": ["terikat", "bebas", "tanpa rima", "tanpa pembayang"], "ans": 0, "exp": "Pantun Nasihat ialah pantun terikat. 华语：固定结构传统诗。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan yang sama pada awal baris disebut...", "options": ["Anafora", "Metafora", "Simile", "Sinkope"], "ans": 0, "exp": "Anafora = pengulangan kata pada awal baris. 华语：首语重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan unsur tumbuhan, buah-buahan atau alam sebagai pembayang ialah...", "options": ["Unsur alam", "Hiperbola", "Personifikasi", "Metafora"], "ans": 0, "exp": "Penggunaan tumbuhan dan alam ialah unsur alam. 华语：自然元素。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan atau frasa tertentu disebut...", "options": ["Repetisi", "Simile", "Anafora", "Metafora"], "ans": 0, "exp": "Repetisi = pengulangan perkataan atau frasa. 华语：重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Susunan kata yang diterbalikkan daripada susunan biasa disebut...", "options": ["Inversi", "Personifikasi", "Hiperbola", "Sinkope"], "ans": 0, "exp": "Inversi ialah susunan kata yang diterbalikkan. 华语：倒装。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Anafora", "Repetisi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Metafora", "Inversi"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan paling baik apabila berasa sangat marah?", "options": ["Bertenang sebelum bercakap", "Terus menjerit", "Membalas dengan kasar", "Menyalahkan semua orang"], "ans": 0, "exp": "Bertenang membantu mengawal emosi dan mengelakkan kata-kata yang disesali. 华语：先冷静再说话。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah kita perlu berhati-hati ketika bercakap?", "options": ["Kata-kata boleh menyinggung perasaan dan membawa akibat buruk", "Supaya orang takut", "Supaya kita sentiasa menang", "Supaya tidak perlu meminta maaf"], "ans": 0, "exp": "Kata-kata yang salah boleh melukakan orang dan menimbulkan masalah. 华语：祸从口出。"}, {"type": "mcq", "skill": "KBAT", "q": "Bagaimanakah suami isteri boleh mengekalkan keharmonian rumah tangga?", "options": ["Saling memahami dan berkomunikasi", "Sering menyalahkan pasangan", "Mementingkan diri", "Mengabaikan masalah"], "ans": 0, "exp": "Persefahaman dan komunikasi membantu mengekalkan keharmonian. 华语：互相理解和沟通。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan jika seseorang sentiasa melakukan kebaikan?", "options": ["Hubungan dengan orang lain menjadi lebih baik", "Semua masalah hilang serta-merta", "Dia tidak perlu bertanggungjawab", "Dia pasti menjadi kaya"], "ans": 0, "exp": "Amalan baik membantu membina hubungan yang positif. 华语：善行能改善人际关系。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pantun Nasihat?", "options": ["Buat baik, jauhi keburukan, jaga tutur kata dan hubungan sesama manusia", "Kejar kekayaan tanpa batas", "Jangan dengar nasihat", "Utamakan diri sendiri"], "ans": 0, "exp": "Pantun Nasihat menekankan kebaikan, berhati-hati, hubungan keluarga dan budi bahasa. 华语：行善、谨慎说话、维护关系。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pantun_nasihat_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pantun_nasihat_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
