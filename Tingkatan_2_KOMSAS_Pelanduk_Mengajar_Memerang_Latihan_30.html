<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelanduk Mengajar Memerang - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · PROSA TRADISIONAL</div><h1>Pelanduk Mengajar Memerang</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Sinopsis", "q": "Siapakah Syah Alam di Rimba?", "options": ["Seekor pelanduk", "Seekor memerang", "Seekor burung bubut", "Seekor biawak"], "ans": 0, "exp": "Syah Alam di Rimba ialah seekor pelanduk. 华语：Syah Alam di Rimba 是一只 pelanduk。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Berapa ekor anak Sang Memerang yang ditemui Syah Alam di Rimba?", "options": ["5", "6", "7", "8"], "ans": 2, "exp": "Syah Alam di Rimba menemui tujuh ekor anak memerang. 华语：共有7只小 memerang。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Mengapakah ibu bapa anak memerang tiada di rumah?", "options": ["Keluar mencari ikan", "Pergi menghadap raja", "Pergi tidur", "Pergi berpindah"], "ans": 0, "exp": "Ibu bapa mereka keluar mencari ikan sebagai makanan. 华语：父母外出捕鱼。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang menyebabkan Syah Alam di Rimba bersilat?", "options": ["Bunyi burung bubut", "Serangan memerang", "Perintah raja", "Bunyi guruh"], "ans": 0, "exp": "Bunyi burung bubut menyebabkan Syah Alam di Rimba bersilat. 华语：听到 burung bubut 的叫声后它开始舞武。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Bagaimanakah tujuh ekor anak memerang mati?", "options": ["Dipijak tanpa sengaja oleh Syah Alam di Rimba", "Dimakan biawak", "Dibawa arus", "Diserang burung"], "ans": 0, "exp": "Anak-anak memerang mati kerana dipijak tanpa sengaja. 华语：被 Syah Alam di Rimba 意外踩死。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Kepada siapakah Sang Memerang membuat aduan?", "options": ["Nabi Allah Sulaiman", "Sang Bubut", "Sang Biawak", "Tuk Ketua"], "ans": 0, "exp": "Sang Memerang mengadu kepada Nabi Allah Sulaiman. 华语：向 Nabi Allah Sulaiman 申诉。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Pelanduk Mengajar Memerang ialah...", "options": ["Balasan terhadap golongan yang menganiayai pihak lain", "Kasih sayang keluarga", "Keindahan alam", "Semangat patriotik"], "ans": 0, "exp": "Tema menekankan balasan terhadap penganiayaan. 华语：欺压别人最终会带来后果。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam cerita ini?", "options": ["Pengadilan memerlukan saksi dan bukti", "Kehidupan di bandar", "Persaingan sukan", "Kemajuan teknologi"], "ans": 0, "exp": "Perbicaraan dalam cerita menunjukkan pentingnya saksi dan bukti. 华语：审判需要证据和证人。"}, {"type": "mcq", "skill": "Persoalan", "q": "Sikap tamak Sang Memerang menunjukkan persoalan...", "options": ["mementingkan diri tanpa memikirkan pihak lain", "keberanian", "kerajinan", "kejujuran"], "ans": 0, "exp": "Sang Memerang mementingkan diri dan menganiayai pihak lain. 华语：贪心并忽视别人的利益。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kejujuran semasa memberi keterangan penting kerana...", "options": ["membantu pengadilan membuat keputusan yang adil", "menjadikan saksi terkenal", "mempercepat hukuman sahaja", "mengelakkan semua konflik"], "ans": 0, "exp": "Keterangan yang jujur membantu hakim membuat keputusan adil. 华语：诚实证词帮助公平审判。"}, {"type": "mcq", "skill": "Watak", "q": "Yang manakah sifat Syah Alam di Rimba?", "options": ["Bijaksana", "Tamak", "Malas", "Sombong"], "ans": 0, "exp": "Syah Alam di Rimba digambarkan bijaksana. 华语：它聪明有智慧。"}, {"type": "mcq", "skill": "Watak", "q": "Nabi Allah Sulaiman digambarkan sebagai pemerintah yang...", "options": ["adil dan bijaksana", "tamak dan kasar", "malas dan cuai", "sombong dan terburu-buru"], "ans": 0, "exp": "Baginda adil, bijaksana dan tidak terburu-buru membuat keputusan. 华语：公平、智慧、不草率。"}, {"type": "mcq", "skill": "Watak", "q": "Sang Memerang akhirnya menunjukkan keinsafan apabila...", "options": ["mengakui kesalahannya", "melarikan diri", "menyalahkan semua saksi", "menolak keputusan"], "ans": 0, "exp": "Sang Memerang akhirnya mengaku kesalahan sendiri. 华语：最后承认错误。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah yang berlaku pada bahagian klimaks?", "options": ["Perbicaraan diadakan dan semua haiwan terlibat dipanggil sebagai saksi", "Syah Alam di Rimba tiba di hutan", "Anak memerang bermain", "Semua haiwan pulang"], "ans": 0, "exp": "Klimaks berlaku semasa perbicaraan dan keterangan saksi dikemukakan. 华语：高潮是法庭审理与逐一作证。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peleraian cerita?", "options": ["Syah Alam di Rimba didapati tidak bersalah", "Sang Memerang menjadi raja", "Nabi Allah Sulaiman meninggalkan negeri", "Semua saksi dihukum"], "ans": 0, "exp": "Akhirnya Syah Alam di Rimba didapati tidak bersalah. 华语：最终 pelanduk 被判无罪。"}, {"type": "mcq", "skill": "Latar", "q": "Yang manakah latar tempat dalam cerita ini?", "options": ["Hutan rimba", "Sekolah", "Lapangan terbang", "Stadium"], "ans": 0, "exp": "Hutan rimba ialah salah satu latar utama. 华语：森林是主要地点之一。"}, {"type": "mcq", "skill": "Latar", "q": "“Dalam lubang” berkaitan dengan tempat tinggal...", "options": ["Sang Memerang dan anak-anaknya", "Nabi Allah Sulaiman", "Sang Bubut", "Sang Biawak"], "ans": 0, "exp": "Lubang ialah tempat tinggal Sang Memerang dan anak-anaknya. 华语：Sang Memerang 一家住在洞里。"}, {"type": "mcq", "skill": "Latar", "q": "Masyarakat dalam cerita ini digambarkan sebagai masyarakat yang...", "options": ["patuh kepada pemerintah", "tidak mengenal undang-undang", "tidak pernah memberi keterangan", "tidak mempunyai pemimpin"], "ans": 0, "exp": "Haiwan-haiwan patuh kepada Nabi Allah Sulaiman sebagai pemerintah. 华语：社会成员服从统治者。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang ditunjukkan Nabi Allah Sulaiman ialah...", "options": ["Keadilan", "Ketamakan", "Kemalasan", "Kesombongan"], "ans": 0, "exp": "Baginda menunjukkan keadilan dalam pengadilan. 华语：公正。"}, {"type": "mcq", "skill": "Nilai", "q": "Haiwan yang bercakap benar semasa perbicaraan menunjukkan nilai...", "options": ["Kejujuran", "Kemarahan", "Ketamakan", "Kesombongan"], "ans": 0, "exp": "Keterangan yang benar menunjukkan nilai kejujuran. 华语：诚实。"}, {"type": "mcq", "skill": "Nilai", "q": "Syah Alam di Rimba yang mengambil berat aduan ikan menunjukkan nilai...", "options": ["Keprihatinan", "Ketamakan", "Kemalasan", "Kesombongan"], "ans": 0, "exp": "Mengambil berat masalah pihak lain menunjukkan keprihatinan. 华语：关心他人。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Pemerintah hendaklah membuat keputusan dengan adil", "Keadilan", "Hakim", "Saksi"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat lengkap. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah bercakap benar ketika...", "options": ["memberi keterangan", "bermain", "tidur", "berniaga sahaja"], "ans": 0, "exp": "Kita perlu bercakap benar ketika memberi keterangan. 华语：作证必须诚实。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah mengakui...", "options": ["kesalahan yang dilakukan", "kejayaan orang lain sahaja", "semua tuduhan", "perkara yang tidak dilakukan"], "ans": 0, "exp": "Kita perlu mengakui kesalahan sendiri. 华语：犯错要承认。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Perkataan seperti “patik”, “baginda”, “bertitah” dan “tuanku” ialah...", "options": ["Bahasa istana", "Bahasa pasar", "Bahasa sains", "Bahasa rojak"], "ans": 0, "exp": "Perkataan tersebut ialah bahasa istana. 华语：宫廷用语。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Perkataan seperti “sebermula” dan “hatta” ialah contoh...", "options": ["Bahasa klasik", "Bahasa teknikal", "Bahasa moden", "Bahasa asing"], "ans": 0, "exp": "Itu ialah bahasa klasik. 华语：古典马来语。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan atau struktur tertentu disebut...", "options": ["Repetisi", "Simile", "Metafora", "Hiperbola"], "ans": 0, "exp": "Repetisi ialah pengulangan kata atau struktur. 华语：重复。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah sesuatu pengadilan perlu berdasarkan bukti dan saksi?", "options": ["Supaya keputusan dibuat secara adil dan tidak terburu-buru", "Supaya hukuman lebih cepat", "Supaya saksi menjadi terkenal", "Supaya semua orang takut"], "ans": 0, "exp": "Bukti dan saksi membantu memastikan keputusan dibuat secara adil. 华语：证据与证人确保判决公平。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan sikap tamak terhadap orang lain?", "options": ["Boleh menyebabkan penganiayaan dan konflik", "Mewujudkan keadilan", "Menguatkan persahabatan", "Menghapus semua masalah"], "ans": 0, "exp": "Sikap tamak boleh menyebabkan orang lain teraniaya dan mencetuskan konflik. 华语：贪婪会伤害别人并引发冲突。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Pelanduk Mengajar Memerang?", "options": ["Setiap tindakan mempunyai akibat dan keadilan memerlukan bukti, saksi serta kejujuran", "Kekuatan fizikal lebih penting daripada keadilan", "Pemimpin boleh menghukum tanpa bukti", "Kesalahan tidak perlu diakui"], "ans": 0, "exp": "Cerita menekankan sebab-akibat, kejujuran dan keadilan. 华语：行为有后果，审判必须建立在证据、证人和诚实之上。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_pelanduk_mengajar_memerang_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_pelanduk_mengajar_memerang_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
