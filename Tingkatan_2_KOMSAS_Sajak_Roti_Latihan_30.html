<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sajak Roti - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Sajak Roti</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah yang membangkitkan selera dalam rangkap pertama Sajak Roti?", "options": ["Bau roti yang harum", "Bunyi hujan", "Warna pakaian", "Suara manusia"], "ans": 0, "exp": "Bau roti yang harum membangkitkan selera. 华语：面包的香味刺激食欲。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah yang berlaku apabila roti dibakar dan terhidang?", "options": ["Selera semakin bertambah", "Selera terus hilang", "Orang menjadi marah", "Orang meninggalkan meja"], "ans": 0, "exp": "Roti yang dibakar dan rangup menyebabkan selera semakin bertambah. 华语：看到酥脆面包，食欲更强。"}, {"type": "mcq", "skill": "Maksud", "q": "Selepas makan roti sehingga kenyang, seseorang mungkin...", "options": ["bersendawa", "menangis", "berlari", "tidur serta-merta"], "ans": 0, "exp": "Sajak menggambarkan seseorang makan hingga kenyang dan bersendawa. 华语：吃饱后甚至打嗝。"}, {"type": "mcq", "skill": "Maksud", "q": "Orang yang beriman akan teringat kepada siapa selepas mereka kenyang?", "options": ["Golongan miskin", "Orang kaya", "Peniaga sahaja", "Pelancong"], "ans": 0, "exp": "Orang beriman dan berperikemanusiaan akan mengingati golongan miskin. 华语：有信仰的人会想到贫困者。"}, {"type": "mcq", "skill": "Maksud", "q": "Jika ramai manusia saling membantu, apakah kesannya?", "options": ["Penderitaan dapat dikurangkan", "Kemiskinan bertambah", "Masyarakat semakin berpecah", "Semua orang menjadi marah"], "ans": 0, "exp": "Saling membantu dapat mengurangkan penderitaan. 华语：互助能减少社会苦难。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Sajak Roti ialah...", "options": ["Orang beriman tidak melupakan golongan miskin ketika hidup senang", "Kehidupan di kedai roti", "Cara membuat roti", "Persaingan mendapatkan makanan"], "ans": 0, "exp": "Tema menekankan keprihatinan orang beriman terhadap golongan miskin. 华语：自己富足时不要忘记贫困者。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam Sajak Roti?", "options": ["Manusia sukar menahan nafsu makan ketika lapar", "Kehidupan nelayan", "Semangat patriotik", "Kemajuan teknologi"], "ans": 0, "exp": "Sajak menyentuh keinginan manusia terhadap makanan ketika lapar. 华语：人在饥饿时难抵食物诱惑。"}, {"type": "mcq", "skill": "Persoalan", "q": "Orang yang beriman tidak seharusnya melupakan...", "options": ["golongan kurang bernasib baik", "orang yang lebih kaya", "hiburan", "persaingan"], "ans": 0, "exp": "Orang beriman perlu mengingati golongan kurang bernasib baik. 华语：不要忘记弱势群体。"}, {"type": "mcq", "skill": "Persoalan", "q": "Bersyukur apabila menerima nikmat merupakan tanda...", "options": ["keimanan", "kemarahan", "kesombongan", "kemalasan"], "ans": 0, "exp": "Kesyukuran dikaitkan dengan keimanan. 华语：感恩是良好信仰与品德的表现。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang ditunjukkan apabila seseorang memikirkan orang miskin ialah...", "options": ["Baik hati", "Tamak", "Sombong", "Malas"], "ans": 0, "exp": "Memikirkan dan membantu golongan miskin menunjukkan nilai baik hati. 华语：善良。"}, {"type": "mcq", "skill": "Nilai", "q": "Bersyukur atas makanan yang dinikmati menunjukkan nilai...", "options": ["Kesyukuran", "Kemarahan", "Keberanian", "Ketegasan"], "ans": 0, "exp": "Nilai yang sesuai ialah kesyukuran. 华语：感恩。"}, {"type": "mcq", "skill": "Nilai", "q": "Mengawal keinginan ketika menikmati kesenangan menunjukkan nilai...", "options": ["Kesederhanaan", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Tidak terlalu menurut hawa nafsu menunjukkan kesederhanaan. 华语：适度。"}, {"type": "mcq", "skill": "Nilai", "q": "Keimanan mendorong seseorang untuk...", "options": ["mengambil berat tentang orang lain", "mementingkan diri", "menghina orang miskin", "membazir makanan"], "ans": 0, "exp": "Keimanan mendorong sikap prihatin dan membantu. 华语：信仰促使人关怀他人。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah mengingati golongan yang kurang bernasib baik", "Baik hati", "Kesyukuran", "Roti"], "ans": 0, "exp": "Pengajaran mesti berbentuk tindakan atau nasihat lengkap. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah memikirkan orang lain supaya...", "options": ["mereka turut mendapat rezeki", "kita menjadi terkenal", "mereka takut kepada kita", "kita tidak perlu bekerja"], "ans": 0, "exp": "Sajak menggalakkan kita berkongsi rezeki dengan orang lain. 华语：让有需要的人也获得帮助。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah bersyukur atas...", "options": ["nikmat kurniaan Tuhan", "kesusahan orang lain", "kekayaan orang lain", "kemarahan"], "ans": 0, "exp": "Kesyukuran terhadap nikmat Tuhan ialah pengajaran penting. 华语：感恩自己得到的恩惠。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak Roti mempunyai berapa rangkap?", "options": ["3", "4", "5", "6"], "ans": 2, "exp": "Sajak Roti mempunyai 5 rangkap. 华语：共有5节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap pertama Sajak Roti mempunyai...", "options": ["4 baris", "5 baris", "6 baris", "7 baris"], "ans": 0, "exp": "Rangkap pertama mempunyai 4 baris. 华语：第一节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rangkap kedua hingga kelima mempunyai...", "options": ["5 baris setiap rangkap", "4 baris setiap rangkap", "6 baris setiap rangkap", "3 baris setiap rangkap"], "ans": 0, "exp": "Rangkap 2 hingga 5 mempunyai 5 baris setiap rangkap. 华语：第2至5节各5行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Sajak Roti berbentuk...", "options": ["bebas", "pantun", "syair", "gurindam"], "ans": 0, "exp": "Sajak Roti ialah sajak bebas. 华语：自由诗。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Memberikan sifat manusia kepada benda atau unsur bukan manusia disebut...", "options": ["Personifikasi", "Simile", "Repetisi", "Inversi"], "ans": 0, "exp": "Personifikasi = memberikan sifat manusia kepada benda bukan manusia. 华语：拟人。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Bahasa yang dilebih-lebihkan untuk memberikan kesan disebut...", "options": ["Hiperbola", "Metafora", "Anafora", "Sinkope"], "ans": 0, "exp": "Hiperbola ialah bahasa yang dilebih-lebihkan. 华语：夸张。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan untuk menegaskan maksud disebut...", "options": ["Repetisi", "Simile", "Personifikasi", "Metafora"], "ans": 0, "exp": "Repetisi = pengulangan perkataan atau frasa. 华语：重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Perbandingan secara langsung tanpa kata pembanding disebut...", "options": ["Metafora", "Simile", "Anafora", "Sinkope"], "ans": 0, "exp": "Metafora ialah perbandingan secara langsung. 华语：隐喻。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Repetisi", "Anafora"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi konsonan yang sama disebut...", "options": ["Aliterasi", "Asonansi", "Metafora", "Simile"], "ans": 0, "exp": "Aliterasi = pengulangan bunyi konsonan. 华语：重复辅音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah kita perlu membantu golongan miskin?", "options": ["Supaya penderitaan mereka dapat dikurangkan", "Supaya kita menjadi terkenal", "Supaya mereka terhutang budi", "Supaya kita lebih kaya"], "ans": 0, "exp": "Bantuan dapat mengurangkan kesusahan dan mewujudkan masyarakat prihatin. 华语：帮助能减轻困难。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah tindakan terbaik apabila mempunyai lebihan makanan?", "options": ["Berkongsi dengan orang yang memerlukan jika sesuai", "Membuangnya", "Menyembunyikannya", "Mengejek orang yang lapar"], "ans": 0, "exp": "Berkongsi makanan yang sesuai ialah tindakan prihatin dan mengelakkan pembaziran. 华语：有余粮时可合理分享。"}, {"type": "mcq", "skill": "KBAT", "q": "Bagaimanakah seseorang boleh menunjukkan kesyukuran terhadap rezeki?", "options": ["Tidak membazir dan berkongsi dengan orang lain", "Membazir makanan", "Mementingkan diri", "Menghina orang miskin"], "ans": 0, "exp": "Tidak membazir dan berkongsi ialah tanda kesyukuran. 华语：不浪费并懂得分享。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Sajak Roti?", "options": ["Ketika kita kenyang dan senang, jangan lupa orang yang lapar dan kurang bernasib baik", "Makanan perlu dinikmati seorang diri", "Kekayaan ialah ukuran keimanan", "Orang miskin perlu berdikari tanpa bantuan"], "ans": 0, "exp": "Sajak menekankan keimanan, kesyukuran dan keprihatinan terhadap golongan miskin. 华语：自己富足时，不要忘记有需要的人。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_sajak_roti_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_sajak_roti_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
