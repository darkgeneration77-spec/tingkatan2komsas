<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syair Nasihat - Latihan Peperiksaan 30 Soalan</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS</div><h1>Syair Nasihat</h1><div class="sub">Penghujung Thamarat al-Muhimmah · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Maksud", "q": "Apakah yang dilakukan oleh penyair dalam rangkap pertama?", "options": ["Menyiapkan sebuah kitab sebagai panduan", "Membina istana", "Mengembara ke negeri lain", "Menjadi raja"], "ans": 0, "exp": "Penyair menyatakan bahawa kitab telah disiapkan untuk dijadikan panduan. 华语：诗人完成作品作为后人的指南。"}, {"type": "mcq", "skill": "Maksud", "q": "Apakah nasihat seorang ayah kepada anaknya?", "options": ["Menjaga tingkah laku dan akhlak", "Mengejar kekayaan", "Mengelakkan ilmu", "Bersikap malas"], "ans": 0, "exp": "Ayah menasihati anak supaya menjaga tingkah laku dan akhlak. 华语：父亲希望孩子有良好品德。"}, {"type": "mcq", "skill": "Maksud", "q": "Anak dinasihati supaya menjauhi sikap...", "options": ["malas", "jujur", "adil", "rajin"], "ans": 0, "exp": "Syair menegur sikap malas. 华语：不要懒惰。"}, {"type": "mcq", "skill": "Maksud", "q": "Jika menjadi raja, anak hendaklah...", "options": ["rajin melaksanakan tugas dan bertindak dengan betul", "mengabaikan rakyat", "mementingkan diri", "menghukum tanpa ilmu"], "ans": 0, "exp": "Seorang raja perlu rajin dan bertindak dengan betul. 华语：成为君主后必须勤政并正确行事。"}, {"type": "mcq", "skill": "Maksud", "q": "Mengapakah ilmu penting kepada seorang pemimpin?", "options": ["Membantu membuat keputusan dan hukuman dengan adil", "Menjadikannya lebih kaya", "Membolehkan dia mengelak tugas", "Membolehkan dia menipu rakyat"], "ans": 0, "exp": "Ilmu membantu pemimpin membezakan benar dan salah serta membuat keputusan yang adil. 华语：知识帮助领导者分辨对错并公平决策。"}, {"type": "mcq", "skill": "Maksud", "q": "Pemimpin yang tidak berilmu akan...", "options": ["menghadapi kesukaran menyelesaikan masalah rakyat", "sentiasa berjaya", "lebih mudah memerintah", "tidak perlu membuat keputusan"], "ans": 0, "exp": "Tanpa ilmu, pemimpin sukar menyelesaikan masalah rakyat. 华语：没有知识的领导者难以解决人民问题。"}, {"type": "mcq", "skill": "Maksud", "q": "Jika menjadi menteri, anak digalakkan berdamping dengan...", "options": ["orang berilmu", "orang kaya sahaja", "orang yang malas", "orang yang suka memuji"], "ans": 0, "exp": "Menteri digalakkan mendampingi orang berilmu. 华语：应多与有学识的人交流。"}, {"type": "mcq", "skill": "Maksud", "q": "Ketua perlu memantau pegawai bawahannya supaya...", "options": ["penyelewengan tidak berlaku", "mereka takut", "mereka tidak bekerja", "semua keputusan dibuat ketua"], "ans": 0, "exp": "Pemantauan penting untuk mengelakkan penyelewengan. 华语：监督下属可避免舞弊。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Syair Nasihat ialah...", "options": ["Nasihat seorang bapa tentang ilmu dan kepimpinan yang adil", "Keindahan alam", "Kasih sayang antara kekasih", "Kehidupan nelayan"], "ans": 0, "exp": "Tema menekankan nasihat seorang bapa kepada anak agar berilmu dan memimpin dengan adil. 华语：父亲劝导孩子成为有知识、公正的领导者。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam Syair Nasihat?", "options": ["Pemimpin wajib memiliki ilmu pengetahuan", "Kehidupan di bandar", "Persaingan sukan", "Keindahan pakaian"], "ans": 0, "exp": "Pemimpin wajib memiliki ilmu ialah persoalan utama syair. 华语：领导者必须有知识。"}, {"type": "mcq", "skill": "Persoalan", "q": "Kerja kebajikan hendaklah dilakukan dengan...", "options": ["ikhlas", "marah", "sombong", "terpaksa"], "ans": 0, "exp": "Kebajikan mesti dilakukan dengan hati yang ikhlas. 华语：行善应真诚。"}, {"type": "mcq", "skill": "Persoalan", "q": "Pengadilan perlu berlandaskan ilmu supaya...", "options": ["hukuman yang dijatuhkan adil", "pemimpin disanjung", "rakyat takut", "masalah diabaikan"], "ans": 0, "exp": "Ilmu memastikan pengadilan dibuat secara adil. 华语：审判要以知识为依据，才能公平。"}, {"type": "mcq", "skill": "Nilai", "q": "Pemimpin yang menghukum dengan adil menunjukkan nilai...", "options": ["Keadilan", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Menghukum dengan adil menunjukkan nilai keadilan. 华语：公正。"}, {"type": "mcq", "skill": "Nilai", "q": "Rajin menuntut ilmu menunjukkan nilai...", "options": ["Berilmu dan kerajinan", "Kemarahan", "Kesombongan", "Ketamakan"], "ans": 0, "exp": "Rajin belajar berkait dengan nilai berilmu dan kerajinan. 华语：有知识与勤奋。"}, {"type": "mcq", "skill": "Nilai", "q": "Menjalankan tanggungjawab dengan hati yang bersih menunjukkan nilai...", "options": ["Keikhlasan", "Keberanian", "Ketamakan", "Kesombongan"], "ans": 0, "exp": "Keikhlasan bermaksud melakukan tugas dengan hati yang tulus. 华语：真诚。"}, {"type": "mcq", "skill": "Nilai", "q": "Memikirkan setiap tindakan dengan teliti menunjukkan nilai...", "options": ["Berhati-hati", "Malas", "Sombong", "Tamak"], "ans": 0, "exp": "Nilai berhati-hati penting dalam membuat keputusan. 华语：谨慎。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Pemimpin hendaklah memiliki ilmu pengetahuan", "Ilmu", "Keadilan", "Raja"], "ans": 0, "exp": "Pengajaran perlu berbentuk ayat tindakan atau nasihat. 华语：启示要写完整行动句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita hendaklah menuntut ilmu yang...", "options": ["benar dan bermanfaat", "menyesatkan", "mudah sahaja", "menguntungkan diri sahaja"], "ans": 0, "exp": "Syair menekankan ilmu yang benar dan tidak menyesatkan. 华语：应学习正确、有益的知识。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Pemerintah hendaklah membuat keputusan secara...", "options": ["adil", "terburu-buru", "berat sebelah", "emosional"], "ans": 0, "exp": "Pemimpin wajib membuat keputusan secara adil. 华语：领导者必须公平决策。"}, {"type": "mcq", "skill": "Bentuk", "q": "Syair Nasihat mempunyai berapa rangkap?", "options": ["7", "10", "18", "20"], "ans": 2, "exp": "Syair Nasihat mempunyai 18 rangkap. 华语：共有18节。"}, {"type": "mcq", "skill": "Bentuk", "q": "Setiap rangkap syair mempunyai...", "options": ["2 baris", "3 baris", "4 baris", "5 baris"], "ans": 2, "exp": "Setiap rangkap syair mempunyai 4 baris. 华语：每节4行。"}, {"type": "mcq", "skill": "Bentuk", "q": "Rima akhir syair biasanya...", "options": ["aaaa", "abab", "aabb", "bebas"], "ans": 0, "exp": "Rima akhir syair ialah aaaa. 华语：尾韵通常是 aaaa。"}, {"type": "mcq", "skill": "Bentuk", "q": "Yang manakah perbezaan penting antara syair dengan pantun?", "options": ["Semua baris syair membawa maksud", "Syair tiada rangkap", "Syair hanya dua baris", "Syair tiada rima"], "ans": 0, "exp": "Dalam syair, semua baris membawa maksud dan tiada pembayang seperti pantun. 华语：syair 四行都是内容，没有 pembayang。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Pengulangan perkataan pada awal baris disebut...", "options": ["Anafora", "Simile", "Sinkope", "Metafora"], "ans": 0, "exp": "Anafora = pengulangan pada awal baris. 华语：首语重复。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Penggunaan perkataan berkaitan agama dan hukum termasuk...", "options": ["Bahasa Arab", "Bahasa pasar", "Bahasa rojak", "Bahasa teknikal sains"], "ans": 0, "exp": "Syair menggunakan bahasa Arab berkaitan agama dan hukum. 华语：出现宗教和法律相关阿拉伯语词汇。"}, {"type": "mcq", "skill": "Gaya Bahasa", "q": "Susunan kata yang diterbalikkan disebut...", "options": ["Inversi", "Repetisi", "Personifikasi", "Hiperbola"], "ans": 0, "exp": "Inversi ialah susunan kata yang diterbalikkan. 华语：倒装。"}, {"type": "mcq", "skill": "Unsur Bunyi", "q": "Pengulangan bunyi vokal yang sama disebut...", "options": ["Asonansi", "Aliterasi", "Anafora", "Responsi"], "ans": 0, "exp": "Asonansi = pengulangan bunyi vokal. 华语：重复元音。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah pemimpin perlu berilmu sebelum membuat keputusan?", "options": ["Supaya keputusan lebih tepat dan adil", "Supaya rakyat takut", "Supaya pemimpin tidak perlu mendengar orang lain", "Supaya semua keputusan cepat"], "ans": 0, "exp": "Ilmu membantu pemimpin membuat keputusan berdasarkan fakta dan prinsip yang betul. 华语：知识能让领导者更准确、公平地判断。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan jika pemimpin tidak memantau pegawai bawahannya?", "options": ["Penyelewengan mungkin berlaku", "Semua urusan menjadi mudah", "Rakyat pasti puas hati", "Masalah terus hilang"], "ans": 0, "exp": "Tanpa pemantauan, penyelewengan atau salah guna kuasa boleh berlaku. 华语：不监督可能导致舞弊。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Syair Nasihat?", "options": ["Pemimpin mesti berilmu, rajin, ikhlas, berhati-hati dan adil", "Pemimpin mesti kaya", "Pemimpin tidak perlu mendengar orang lain", "Ilmu tidak penting jika mempunyai kuasa"], "ans": 0, "exp": "Syair menekankan ilmu, keadilan, keikhlasan, kerajinan dan tanggungjawab pemimpin. 华语：领导者必须有知识、公正、真诚、勤奋和责任感。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_syair_nasihat_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_syair_nasihat_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
