<style>
:root{--bg:#f5f7fb;--text:#172033;--p:#315ed8;--soft:#eef3ff;--ok:#13795b;--bad:#b42318;--border:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}.hero{background:linear-gradient(135deg,#173a8f,#315ed8 55%,#7048d9);color:#fff;padding:42px 20px}.wrap{max-width:1000px;margin:auto}h1{margin:7px 0;font-size:clamp(2rem,5vw,3.2rem)}.sub{opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff18;border:1px solid #ffffff33;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:1.35rem}main{padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0}.qnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--p);font-weight:900}.skill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#f0f2f6;font-weight:800;font-size:.76rem}.q{font-size:1.05rem;font-weight:800;margin:14px 0}.options{display:grid;gap:9px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:11px 12px;border-radius:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#a7b8ee;background:#fafcff}.opt input{margin-top:4px}.result{display:none;margin-top:13px;padding:12px 14px;border-radius:12px}.correct{background:#edf9f5;border-left:4px solid var(--ok)}.wrong{background:#fff1f0;border-left:4px solid var(--bad)}.toolbar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px;z-index:10}.buttons{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e9edf5;color:#24324b}.summary{display:none;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:20px 0}.bar{height:11px;border-radius:999px;background:#edf0f5;overflow:hidden}.fill{height:100%;background:var(--p);width:0}.skillrow{margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div style="font-weight:800;letter-spacing:.05em">TINGKATAN 2 BAHASA MELAYU · KOMSAS · CERPEN</div><h1>Talia dan Raksasa Qadqad</h1><div class="sub">Latihan Peperiksaan · 30 Soalan · 自动评分 + 错题分析</div><div class="stats"><div class="stat"><b id="done">0</b>Sudah Jawab</div><div class="stat"><b>30</b>Jumlah Soalan</div><div class="stat"><b id="score">-</b>Markah</div><div class="stat"><b id="percent">-</b>Peratus</div></div></div></header>
<main class="wrap"><div class="summary" id="summary"><h2>Analisis Prestasi 成绩分析</h2><div id="summaryText"></div><h3>Analisis Mengikut Kemahiran</h3><div id="skills"></div></div><div id="quiz"></div></main>
<div class="toolbar"><div class="buttons"><button class="primary" onclick="submitQuiz()">Hantar & Semak / 批改</button><button class="secondary" onclick="showWrong()">Tunjuk Soalan Salah / 错题</button><button class="secondary" onclick="resetQuiz()">Ulang Semula / 重做</button></div></div>
<script>
const QUESTIONS=[{"type": "mcq", "skill": "Sinopsis", "q": "Di manakah Talia menemui Raksasa Qadqad yang cedera?", "options": ["Di sempadan huma berhampiran hutan di Bukit Ungu", "Di hospital", "Di stesen kereta api", "Di balai polis"], "ans": 0, "exp": "Talia menemui Qadqad di sempadan huma berhampiran hutan di Bukit Ungu. 华语：Talia 在 Bukit Ungu 附近的农地边缘发现受伤的 Qadqad。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang digunakan Talia untuk merawat Qadqad?", "options": ["Pucuk daun dalut", "Air sungai", "Kain putih", "Ubat hospital"], "ans": 0, "exp": "Talia menggunakan pucuk daun dalut untuk merawat Qadqad. 华语：她用 pucuk daun dalut 为它治疗。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Siapakah Jini?", "options": ["Adik Talia", "Ayah Talia", "Ketua kampung", "Pemandu kereta api"], "ans": 0, "exp": "Jini ialah adik Talia. 华语：Jini 是 Talia 的弟弟。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Mengapakah keluarga Talia pergi ke bandar?", "options": ["Jini demam teruk dan perlu dirawat", "Mereka mahu bercuti", "Mereka mahu membeli rumah", "Mereka mahu menjual tanah"], "ans": 0, "exp": "Jini mengalami demam teruk lalu dibawa ke bandar untuk rawatan. 华语：Jini 高烧，需要到城市就医。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Siapakah yang mahu menguasai Bukit Ungu?", "options": ["Tuan Binjah", "Sidek", "Tuk Sibat", "Milan"], "ans": 0, "exp": "Tuan Binjah mahu menguasai Bukit Ungu demi keuntungan. 华语：Tuan Binjah 为利益想夺取 Bukit Ungu。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Mengapakah Raksasa Qadqad menyerang kawasan manusia?", "options": ["Sarang dan keluarganya dimusnahkan oleh manusia", "Kerana lapar semata-mata", "Kerana dipanggil polis", "Kerana mahu berpindah"], "ans": 0, "exp": "Qadqad menyerang selepas sarang dan keluarganya dimusnahkan. 华语：因为栖息地和同类被人类破坏。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Mengapakah Qadqad tidak menyerang Talia?", "options": ["Mengenang budi Talia yang pernah merawatnya", "Takut kepada Talia", "Tidak mengenali Talia", "Talia membawa senjata"], "ans": 0, "exp": "Qadqad mengenang budi Talia yang pernah menolongnya. 华语：它懂得报恩。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang berlaku kepada Dodo ketika mempertahankan kampung?", "options": ["Ditembak pada lengan kiri", "Ditangkap polis", "Terjatuh ke sungai", "Berpindah ke bandar"], "ans": 0, "exp": "Dodo ditembak pada lengan kirinya. 华语：Dodo 左臂中枪。"}, {"type": "mcq", "skill": "Sinopsis", "q": "Apakah yang berlaku selepas Talia memanggil Qadqad?", "options": ["Beratus-ratus Qadqad menyerang Binjah dan pengikutnya", "Polis tiba segera", "Kampung dibakar", "Penduduk berpindah"], "ans": 0, "exp": "Beratus-ratus Qadqad keluar dan menyerang Binjah serta pengikutnya. 华语：大量 Qadqad 出现并反击。"}, {"type": "mcq", "skill": "Tema", "q": "Tema utama Talia dan Raksasa Qadqad ialah...", "options": ["Kerakusan manusia membawa kemusnahan dan konflik dengan alam", "Kasih sayang ibu bapa sahaja", "Semangat patriotik", "Kehidupan di sekolah"], "ans": 0, "exp": "Tema utama ialah kerakusan manusia terhadap alam dan kesannya. 华语：人类贪婪破坏自然，最终引发冲突与毁灭。"}, {"type": "mcq", "skill": "Persoalan", "q": "Yang manakah persoalan dalam cerpen ini?", "options": ["Keberanian mempertahankan hak", "Persaingan akademik", "Kehidupan nelayan", "Kemajuan teknologi"], "ans": 0, "exp": "Keberanian mempertahankan hak ialah persoalan penting. 华语：勇于维护权益。"}, {"type": "mcq", "skill": "Persoalan", "q": "Talia merawat Qadqad yang cedera menunjukkan persoalan...", "options": ["Membantu makhluk yang memerlukan pertolongan", "Mementingkan diri", "Mengejar keuntungan", "Membalas dendam"], "ans": 0, "exp": "Talia membantu makhluk yang memerlukan. 华语：帮助受伤的生命。"}, {"type": "mcq", "skill": "Persoalan", "q": "Perbuatan Binjah menunjukkan persoalan...", "options": ["Sikap tamak manusia", "Kasih sayang", "Kejujuran", "Kesabaran"], "ans": 0, "exp": "Binjah digambarkan tamak dan mementingkan keuntungan. 华语：贪婪。"}, {"type": "mcq", "skill": "Watak", "q": "Apakah sifat Talia?", "options": ["Berani dan penyayang", "Tamak dan kasar", "Malas dan sombong", "Pengecut dan penting diri"], "ans": 0, "exp": "Talia berani, penyayang dan suka menolong. 华语：勇敢、有爱心、乐于助人。"}, {"type": "mcq", "skill": "Watak", "q": "Dodo digambarkan sebagai seorang ayah yang...", "options": ["bertanggungjawab dan berani", "tamak dan malas", "sombong dan cuai", "pengecut dan penting diri"], "ans": 0, "exp": "Dodo bertanggungjawab, penyayang dan berani mempertahankan keluarga. 华语：有责任感并勇敢保护家人。"}, {"type": "mcq", "skill": "Watak", "q": "Tuan Binjah ialah seorang yang...", "options": ["tamak dan kejam", "baik hati dan jujur", "sabar dan prihatin", "rajin dan rendah diri"], "ans": 0, "exp": "Binjah tamak, ego dan kejam. 华语：贪婪、自负、残忍。"}, {"type": "mcq", "skill": "Watak", "q": "Sidek ialah...", "options": ["Pemandu kereta api yang membantu keluarga Talia", "Ketua suku orang asli", "Ayah Talia", "Doktor"], "ans": 0, "exp": "Sidek ialah pemandu kereta api lombong yang prihatin dan membantu. 华语：Sidek 是帮助 Talia 一家的火车司机。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peristiwa permulaan cerpen?", "options": ["Talia merawat Qadqad yang cedera", "Dodo ditembak", "Binjah terbunuh", "Kampung diserang"], "ans": 0, "exp": "Cerpen bermula apabila Talia menemui dan merawat Qadqad. 华语：故事从 Talia 救治 Qadqad 开始。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peristiwa klimaks?", "options": ["Binjah menyerang perkampungan dan Dodo ditembak", "Jini demam", "Talia bermain", "Sidek memandu kereta api"], "ans": 0, "exp": "Klimaks berlaku apabila Binjah menyerang kampung dan Dodo ditembak. 华语：高潮是 Binjah 袭击村庄，Dodo 中枪。"}, {"type": "mcq", "skill": "Plot", "q": "Apakah peleraian cerita?", "options": ["Qadqad menyerang Binjah dan penduduk kampung terselamat", "Talia pergi ke bandar", "Jini demam", "Binjah membeli tanah"], "ans": 0, "exp": "Peleraian berlaku apabila Qadqad membantu menyelamatkan kampung. 华语：Qadqad 反击，村民获救。"}, {"type": "mcq", "skill": "Latar", "q": "Yang manakah latar tempat utama?", "options": ["Bukit Ungu", "Istana", "Stadium", "Sekolah"], "ans": 0, "exp": "Bukit Ungu ialah latar utama cerpen. 华语：Bukit Ungu 是主要地点。"}, {"type": "mcq", "skill": "Latar", "q": "Masyarakat dalam cerpen ini termasuk...", "options": ["Masyarakat orang asli yang bertani dan berpindah-randah", "Masyarakat istana", "Masyarakat pelaut", "Masyarakat sekolah sahaja"], "ans": 0, "exp": "Cerpen memaparkan masyarakat orang asli yang bertani. 华语：故事描写原住民农业社会。"}, {"type": "mcq", "skill": "Nilai", "q": "Nilai yang ditunjukkan Talia ketika merawat Qadqad ialah...", "options": ["Baik hati", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Menolong makhluk yang cedera menunjukkan nilai baik hati. 华语：善良。"}, {"type": "mcq", "skill": "Nilai", "q": "Dodo mempertahankan kampung menunjukkan nilai...", "options": ["Keberanian", "Ketamakan", "Kesombongan", "Kemarahan"], "ans": 0, "exp": "Dodo menunjukkan keberanian. 华语：勇敢。"}, {"type": "mcq", "skill": "Nilai", "q": "Qadqad membalas pertolongan Talia menunjukkan nilai...", "options": ["Mengenang budi", "Ketamakan", "Kesombongan", "Kemalasan"], "ans": 0, "exp": "Qadqad mengenang budi Talia. 华语：知恩图报。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Yang manakah pengajaran yang sesuai?", "options": ["Kita hendaklah prihatin terhadap haiwan dan alam semula jadi", "Alam sekitar", "Qadqad", "Talia"], "ans": 0, "exp": "Pengajaran perlu berbentuk tindakan atau nasihat. 华语：启示要写完整句。"}, {"type": "mcq", "skill": "Pengajaran", "q": "Kita mestilah berani mempertahankan...", "options": ["hak yang benar", "ketamakan", "kejahatan", "penyelewengan"], "ans": 0, "exp": "Kita perlu berani mempertahankan hak yang benar. 华语：勇于维护正当权益。"}, {"type": "mcq", "skill": "KBAT", "q": "Mengapakah pembangunan tidak boleh mengabaikan alam sekitar?", "options": ["Kerana kerosakan alam boleh menjejaskan manusia, haiwan dan komuniti setempat", "Kerana pembangunan tidak penting", "Kerana alam tidak boleh digunakan langsung", "Kerana semua projek mesti dihentikan"], "ans": 0, "exp": "Pembangunan perlu seimbang agar tidak memusnahkan ekosistem dan kehidupan manusia. 华语：发展必须兼顾环境与社区。"}, {"type": "mcq", "skill": "KBAT", "q": "Apakah kesan kerakusan terhadap sumber alam?", "options": ["Boleh mencetuskan kemusnahan dan konflik", "Mewujudkan keharmonian", "Menguatkan alam", "Menghapus semua masalah"], "ans": 0, "exp": "Kerakusan boleh merosakkan alam dan mencetuskan konflik. 华语：贪婪会破坏环境并引发冲突。"}, {"type": "mcq", "skill": "Keseluruhan", "q": "Apakah mesej umum Talia dan Raksasa Qadqad?", "options": ["Kebaikan dibalas dengan kebaikan, manakala kerakusan terhadap alam membawa kemusnahan", "Kekuatan fizikal paling penting", "Alam boleh dimusnahkan tanpa akibat", "Hak orang lain boleh diabaikan"], "ans": 0, "exp": "Cerpen menekankan mengenang budi, mempertahankan hak dan menjaga alam. 华语：善有善报，贪婪破坏自然会带来后果。"}]; const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';QUESTIONS.forEach((x,i)=>{const card=document.createElement('div');card.className='card';card.id='qcard'+i;card.innerHTML=`<span class="qnum">${i+1}</span><span class="skill">${x.skill}</span><div class="q">${x.q}</div><div class="options">${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="countDone()"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div><div class="result" id="res${i}"></div>`;quiz.appendChild(card);})}
function countDone(){let n=0;QUESTIONS.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});document.getElementById('done').textContent=n}
function submitQuiz(){let score=0;const skills={};QUESTIONS.forEach((x,i)=>{if(!skills[x.skill])skills[x.skill]={ok:0,total:0};skills[x.skill].total++;const sel=document.querySelector(`input[name=q${i}]:checked`);const r=document.getElementById('res'+i);r.style.display='block';if(sel&&Number(sel.value)===x.ans){score++;skills[x.skill].ok++;r.className='result correct';r.innerHTML='<b>Betul / 正确</b><br>'+x.exp}else{r.className='result wrong';r.innerHTML=`<b>Salah / 错误</b><br>Jawapan: ${String.fromCharCode(65+x.ans)}. ${x.options[x.ans]}<br>${x.exp}`}});const pct=Math.round(score/QUESTIONS.length*100);document.getElementById('score').textContent=score+'/30';document.getElementById('percent').textContent=pct+'%';document.getElementById('summary').style.display='block';let level=pct>=85?'Cemerlang / 优秀':pct>=70?'Baik / 良好':pct>=50?'Perlu Kukuhkan / 需要加强':'Perlu Pemulihan / 需要补救';document.getElementById('summaryText').innerHTML=`<p><b>${score} / 30 (${pct}%)</b> · ${level}</p>`;let html='';Object.entries(skills).forEach(([k,v])=>{const p=Math.round(v.ok/v.total*100);html+=`<div class="skillrow"><b>${k}</b> — ${v.ok}/${v.total} (${p}%)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`});document.getElementById('skills').innerHTML=html;localStorage.setItem('komsas_talia_qadqad_result',JSON.stringify({score,pct,skills,date:new Date().toISOString()}));window.scrollTo({top:document.getElementById('summary').offsetTop-20,behavior:'smooth'})}
function showWrong(){let first=null;QUESTIONS.forEach((x,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);const card=document.getElementById('qcard'+i);const wrong=!sel||Number(sel.value)!==x.ans;card.style.display=wrong?'block':'none';if(wrong&&!first)first=card});if(first)first.scrollIntoView({behavior:'smooth',block:'start'})}
function resetQuiz(){localStorage.removeItem('komsas_talia_qadqad_result');render();document.getElementById('done').textContent='0';document.getElementById('score').textContent='-';document.getElementById('percent').textContent='-';document.getElementById('summary').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
