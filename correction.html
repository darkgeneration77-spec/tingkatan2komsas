<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembetulan Salah KOMSAS</title><style>:root{--b:#326ff4;--g:#20ad70;--r:#d94d61;--y:#f1b840;--ink:#20324d;--muted:#74839b;--line:#dae6f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#e8f1ff,#f8fbff 50%,#eef9f3);color:var(--ink)}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:900;text-decoration:none;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 0 #cbd9ee}.hero{margin:24px 0;background:linear-gradient(145deg,#ec6a78,#b93b62);color:#fff;border-radius:27px;padding:28px;box-shadow:0 13px 0 #8e2947}.hero h1{margin:0 0 7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:15px;padding:12px}.stat b{display:block;font-size:1.5rem}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:19px;margin:17px 0;box-shadow:0 7px 0 #d4e1f2}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.72rem;font-weight:950}.bad{background:#ffe8eb;color:#a92539}.ok{background:#e5f8ee;color:#116f47}.q{font-size:1.05rem;font-weight:850;margin:14px 0}.answer{display:grid;grid-template-columns:1fr auto;gap:10px}.answer input{width:100%;padding:13px;border:2px solid #dbe6f5;border-radius:12px;font-size:1rem}.check{border:0;border-radius:12px;padding:11px 16px;background:var(--b);color:#fff;font-weight:950;cursor:pointer;box-shadow:0 5px 0 #214da8}.feedback{margin-top:12px;padding:12px;border-radius:12px;display:none}.feedback.good{display:block;background:#e9f9f0;color:#106e46}.feedback.no{display:block;background:#fff0f1;color:#a62839}.empty{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center;box-shadow:0 7px 0 #d4e1f2}.empty h2{margin-top:0}@media(max-width:650px){.stats{grid-template-columns:1fr}.answer{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="btn" href="student-dashboard.html">← Student Dashboard</a><a class="btn" href="progress-map.html">Peta Kemajuan / 学习地图</a></div><section class="hero"><h1>Pembetulan Salah 错题订正</h1><div id="who">Memuatkan...</div><div class="stats"><div class="stat"><b id="pendingCount">0</b>Belum dibetulkan</div><div class="stat"><b id="doneCount">0</b>Sudah dibetulkan</div><div class="stat"><b id="rate">0%</b>Kadar pembetulan</div></div></section><main id="list"></main></div><script src="tracking.js"></script><script>let DATA=[],P=null;function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,' ')}function latestQuizzes(data){const m={};data.filter(e=>e.type==='quiz').forEach(q=>{const k=q.file||q.work;m[k]=q});return Object.values(m)}function correctionKeys(data){const s=new Set();data.filter(e=>e.type==='correction').forEach(c=>(c.wrong||[]).forEach(w=>{if(w.key)s.add(w.key)}));return s}function wrongItems(data){const fixed=correctionKeys(data),items=[];latestQuizzes(data).forEach(q=>(q.wrong||[]).forEach(w=>{const key=(q.file||q.work)+'|'+(q.ts||q.id||'')+'|'+w.no;items.push({...w,key,sourceTs:q.ts||'',work:q.work,file:q.file,fixed:fixed.has(key)})}));return items}async function fetchData(){P=KOMSASTracker.getProfile();if(!P){location.href='student-dashboard.html';return}who.textContent=P.name+(P.kelas?' · '+P.kelas:'')+' · '+P.id;let d=KOMSASTracker.logs().filter(e=>(e.studentId&&e.studentId===P.id)||(!e.studentId&&e.student===P.name));try{const r=await fetch('/api/student?id='+encodeURIComponent(P.id));if(r.ok){const j=await r.json();if(Array.isArray(j.events))d=j.events}}catch{}DATA=d;render()}function render(){const all=wrongItems(DATA),pending=all.filter(x=>!x.fixed),done=all.filter(x=>x.fixed);pendingCount.textContent=pending.length;doneCount.textContent=done.length;rate.textContent=all.length?Math.round(done.length/all.length*100)+'%':'100%';if(!pending.length){list.innerHTML='<div class="empty"><h2>Semua pembetulan selesai</h2><p>目前没有待订正错题。继续保持。</p></div>';return}list.innerHTML=pending.map((w,i)=>`<article class="card" id="c${i}"><div class="head"><span class="tag bad">Soalan ${w.no}</span><span class="tag bad">${w.skill||'Kemahiran'}</span></div><h3>${w.work||'Latihan KOMSAS'}</h3><div class="q">${w.question||''}</div><div class="answer"><input id="a${i}" placeholder="Taip jawapan betul / 输入正确答案" autocomplete="off"><button class="check" onclick="check(${i})">Semak / 检查</button></div><div class="feedback" id="f${i}"></div></article>`).join('');window.PENDING=pending}async function check(i){const w=PENDING[i],input=document.getElementById('a'+i),f=document.getElementById('f'+i),answer=input.value.trim();if(!answer){f.className='feedback no';f.textContent='Sila masukkan jawapan dahulu / 请先输入答案';return}if(norm(answer)!==norm(w.correctAnswer)){f.className='feedback no';f.innerHTML='<b>Belum tepat / 还不正确</b><br>Petunjuk: semak semula nota atau jawapan asal, kemudian cuba lagi.';return}f.className='feedback good';f.innerHTML='<b>Betul / 订正成功</b><br>Soalan ini akan ditandakan sebagai Sudah Dibetulkan.';input.disabled=true;input.nextElementSibling.disabled=true;const event={type:'correction',studentId:P.id,student:P.name,kelas:P.kelas||'',work:w.work||'',file:w.file||'',correct:1,total:1,percent:100,wrong:[{key:w.key,no:w.no,skill:w.skill||'',status:'done',sourceTs:w.sourceTs}],skills:{},ts:new Date().toISOString()};try{await fetch('/api/track',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(event)});DATA.push(event);setTimeout(render,650)}catch{f.className='feedback no';f.textContent='Rekod gagal disimpan. Cuba lagi.'}}fetchData();</script></body></html>
