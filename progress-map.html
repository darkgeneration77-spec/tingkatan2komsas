<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peta Kemajuan KOMSAS</title><style>:root{--ink:#20324d;--muted:#71809a;--blue:#3674f5;--green:#20b574;--yellow:#f4b83f;--grey:#d9e3f2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;color:var(--ink);background:linear-gradient(180deg,#dce9ff,#f5f9ff 45%,#eaf8f0);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{background:#fff;color:var(--ink);text-decoration:none;border:1px solid #d9e5f7;border-radius:14px;padding:11px 15px;font-weight:900;box-shadow:0 5px 0 #cbd9ee}.hero{margin:22px 0 30px;padding:28px;border-radius:28px;color:#fff;background:linear-gradient(145deg,#3978ff,#745be5);box-shadow:0 13px 0 #294ea9}.hero h1{margin:0 0 7px;font-size:clamp(2rem,5vw,3.6rem)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.s{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:15px;padding:12px}.s b{display:block;font-size:1.5rem}.overall{height:14px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:18px}.overall div{height:100%;background:#fff;width:0;transition:.6s}.genre{margin:32px 0}.genre h2{margin:0 0 16px}.path{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.node{position:relative;background:#fff;border:1px solid #dce7f7;border-radius:23px;padding:18px;box-shadow:0 8px 0 #d3e0f1;min-height:180px;transition:.2s}.node:hover{transform:translateY(-3px)}.node:before{content:'';position:absolute;left:22px;top:-18px;width:4px;height:18px;background:#bfd0e9}.node:nth-child(-n+3):before{display:none}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.72rem;font-weight:950}.notstarted .badge{background:#eef2f7;color:#728198}.reading .badge{background:#fff3d8;color:#9b6810}.completed .badge{background:#e5f8ee;color:#11764a}.node h3{margin:12px 0 7px;font-size:1.05rem}.meta{font-size:.8rem;color:var(--muted);font-weight:800}.meter{height:9px;background:#edf2f8;border-radius:99px;overflow:hidden;margin:14px 0}.meter div{height:100%;width:0;background:var(--blue)}.completed .meter div{background:var(--green)}.reading .meter div{background:var(--yellow)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{text-decoration:none;padding:8px 10px;border-radius:10px;font-size:.78rem;font-weight:900;background:#edf3ff;color:#31599f}.actions a.quiz{background:#e8f8ef;color:#15734b}.legend{display:flex;gap:12px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 5px 0 #d6e1f1;font-size:.82rem;font-weight:850}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.d0{background:#aab7ca}.d1{background:var(--yellow)}.d2{background:var(--green)}@media(max-width:850px){.path{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:550px){.path,.summary{grid-template-columns:1fr}.node:before{display:none}}</style></head><body><div class="wrap"><div class="top"><a class="btn" href="student-dashboard.html">← Student Dashboard</a><a class="btn" href="index.html">Laman Utama / 主页</a></div><section class="hero"><h1>Peta Kemajuan Pembelajaran</h1><div id="who">Learning Progress Map / 学习进度地图</div><div class="summary"><div class="s"><b id="done">0/16</b>Karya lengkap</div><div class="s"><b id="read">0</b>Nota dibaca</div><div class="s"><b id="quiz">0</b>Latihan selesai</div><div class="s"><b id="pc">0%</b>Kemajuan</div></div><div class="overall"><div id="overallFill"></div></div></section><div class="legend"><span><i class="dot d0"></i>Belum mula 未开始</span><span><i class="dot d1"></i>Sedang belajar 学习中</span><span><i class="dot d2"></i>Lengkap 已完成</span></div><div id="map"></div></div><script src="tracking.js"></script><script>const works=[['Puisi Tradisional 传统诗歌','Pantun Alam Remaja','Tingkatan_2_KOMSAS_Pantun_Alam_Remaja.html','Tingkatan_2_KOMSAS_Pantun_Alam_Remaja_Latihan_30.html'],['Puisi Tradisional 传统诗歌','Pantun Kiasan','Tingkatan_2_KOMSAS_Pantun_Kiasan.html','Tingkatan_2_KOMSAS_Pantun_Kiasan_Latihan_30.html'],['Puisi Tradisional 传统诗歌','Pantun Budi','Tingkatan_2_KOMSAS_Pantun_Budi.html','Tingkatan_2_KOMSAS_Pantun_Budi_Latihan_30.html'],['Puisi Tradisional 传统诗歌','Pantun Nasihat','Tingkatan_2_KOMSAS_Pantun_Nasihat.html','Tingkatan_2_KOMSAS_Pantun_Nasihat_Latihan_30.html'],['Puisi Tradisional 传统诗歌','Pantun Kasih Sayang','Tingkatan_2_KOMSAS_Pantun_Kasih_Sayang.html','Tingkatan_2_KOMSAS_Pantun_Kasih_Sayang_Latihan_30.html'],['Puisi Tradisional 传统诗歌','Syair Nasihat','Tingkatan_2_KOMSAS_Syair_Nasihat.html','Tingkatan_2_KOMSAS_Syair_Nasihat_Latihan_30.html'],['Sajak 现代诗','Dalam Persekitaran Kata-kata','Tingkatan_2_KOMSAS_Dalam_Persekitaran_Kata_kata.html','Tingkatan_2_KOMSAS_Dalam_Persekitaran_Kata_kata_Latihan_30.html'],['Sajak 现代诗','Roti','Tingkatan_2_KOMSAS_Roti.html','Tingkatan_2_KOMSAS_Roti_Latihan_30.html'],['Sajak 现代诗','Kucari Damai di Sini','Tingkatan_2_KOMSAS_Kucari_Damai_di_Sini.html','Tingkatan_2_KOMSAS_Kucari_Damai_di_Sini_Latihan_30.html'],['Sajak 现代诗','Pada Sekuntum Mawar','Tingkatan_2_KOMSAS_Pada_Sekuntum_Mawar.html','Tingkatan_2_KOMSAS_Pada_Sekuntum_Mawar_Latihan_30.html'],['Prosa Tradisional 传统散文','Pelanduk Mengajar Memerang','Tingkatan_2_KOMSAS_Pelanduk_Mengajar_Memerang.html','Tingkatan_2_KOMSAS_Pelanduk_Mengajar_Memerang_Latihan_30.html'],['Cerpen 短篇小说','Banjir di Mata Emak','Tingkatan_2_KOMSAS_Banjir_di_Mata_Emak.html','Tingkatan_2_KOMSAS_Banjir_di_Mata_Emak_Latihan_30.html'],['Cerpen 短篇小说','Talia dan Raksasa Qadqad','Tingkatan_2_KOMSAS_Talia_dan_Raksasa_Qadqad.html','Tingkatan_2_KOMSAS_Talia_dan_Raksasa_Qadqad_Latihan_30.html'],['Cerpen 短篇小说','Menuai Emas','Tingkatan_2_KOMSAS_Menuai_Emas.html','Tingkatan_2_KOMSAS_Menuai_Emas_Latihan_30.html'],['Drama 戏剧','Mahkamah','Tingkatan_2_KOMSAS_Mahkamah.html','Tingkatan_2_KOMSAS_Mahkamah_Latihan_30.html'],['Novel 小说','Jalan ke Puncak','Tingkatan_2_KOMSAS_Jalan_ke_Puncak.html','Tingkatan_2_KOMSAS_Jalan_ke_Puncak_Latihan_30.html']];function norm(s){return decodeURIComponent(s||'').toLowerCase()}function localData(p){return KOMSASTracker.logs().filter(e=>p&&((e.studentId&&e.studentId===p.id)||(!e.studentId&&e.student===p.name)))}async function init(){const p=KOMSASTracker.getProfile();if(!p){location.href='student-dashboard.html';return}who.textContent=p.name+(p.kelas?' · '+p.kelas:'')+' · '+p.id+' · Learning Progress Map / 学习进度地图';let data=localData(p);try{const r=await fetch('/api/student?id='+encodeURIComponent(p.id));if(r.ok){const j=await r.json();if(Array.isArray(j.events))data=j.events}}catch{}const reads=new Set(data.filter(e=>e.type==='read').map(e=>norm(e.file)));const quizzes=data.filter(e=>e.type==='quiz');const qfiles=new Set(quizzes.map(e=>norm(e.file)));let complete=0,readN=0,quizN=0;const groups={};works.forEach(w=>{const hasRead=reads.has(norm(w[2]));const hasQuiz=qfiles.has(norm(w[3]));if(hasRead)readN++;if(hasQuiz)quizN++;if(hasRead&&hasQuiz)complete++;(groups[w[0]]??=[]).push({...{genre:w[0],name:w[1],note:w[2],quiz:w[3]},hasRead,hasQuiz})});done.textContent=complete+'/16';read.textContent=readN;quiz.textContent=quizN;const progress=Math.round((readN+quizN)/32*100);pc.textContent=progress+'%';overallFill.style.width=progress+'%';map.innerHTML=Object.entries(groups).map(([g,arr])=>`<section class="genre"><h2>${g}</h2><div class="path">${arr.map(x=>{const state=x.hasRead&&x.hasQuiz?'completed':(x.hasRead||x.hasQuiz?'reading':'notstarted');const label=state==='completed'?'Lengkap / 已完成':state==='reading'?'Sedang belajar / 学习中':'Belum mula / 未开始';const pct=(x.hasRead?50:0)+(x.hasQuiz?50:0);return `<article class="node ${state}"><span class="badge">${label}</span><h3>${x.name}</h3><div class="meta">Nota ${x.hasRead?'✓':'○'} · Latihan ${x.hasQuiz?'✓':'○'}</div><div class="meter"><div style="width:${pct}%"></div></div><div class="actions"><a href="${x.note}">${x.hasRead?'Ulang Nota':'Baca Nota'}</a><a class="quiz" href="${x.quiz}">${x.hasQuiz?'Buat Semula':'Latihan 30'}</a></div></article>`}).join('')}</div></section>`).join('')}init();</script></body></html>
