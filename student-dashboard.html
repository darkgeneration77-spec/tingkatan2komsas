<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard KOMSAS</title><style>:root{--b:#2f6df6;--g:#23b574;--r:#e85b6b;--ink:#20324d;--muted:#73819a;--line:#dbe7f7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#eaf2ff,#f7fbff);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.home,.btn{background:#fff;border:1px solid var(--line);box-shadow:0 5px 0 #cad9ef;border-radius:13px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:900}.hero{margin:24px 0;background:linear-gradient(145deg,#3d7cff,#6f5de7);color:#fff;padding:28px;border-radius:26px;box-shadow:0 13px 0 #2a51ad}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 7px 0 #d4e1f3}.stat b{display:block;font-size:1.8rem}.panel{margin-top:18px}.bar{height:10px;background:#edf2f8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:.75rem;font-weight:900}.bad{background:#ffe8eb;color:#b42336}.ok{background:#e8f8f1;color:#117655}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="home" href="index.html">← 主页 / Laman Utama</a><button class="btn" onclick="changeStudent()">Tukar Nama / 更换学生</button></div><section class="hero"><h1>Student Dashboard 学生学习仪表板</h1><div id="who">Memuatkan...</div></section><div class="grid"><div class="stat"><b id="readCount">0</b>Karya dibaca</div><div class="stat"><b id="quizCount">0</b>Latihan dibuat</div><div class="stat"><b id="avg">0%</b>Purata</div><div class="stat"><b id="pending">0</b>Belum dibetulkan</div></div><section class="panel"><h2>Penguasaan Kemahiran 技能掌握</h2><div id="skills"></div></section><section class="panel"><h2>Latihan Saya 我的练习</h2><div style="overflow:auto"><table><thead><tr><th>Karya</th><th>Markah</th><th>Salah</th><th>Status</th></tr></thead><tbody id="quizRows"></tbody></table></div></section><section class="panel"><h2>Perlu Dibetulkan 待订正</h2><div id="wrongList"></div></section><section class="panel"><h2>Cadangan Pengukuhan 加强建议</h2><div id="recommend"></div></section></div><script src="tracking.js"></script><script>function profile(){return KOMSASTracker.getProfile()}function localData(){const p=profile();return KOMSASTracker.logs().filter(x=>p&&x.student===p.name)}function render(data){const p=profile();who.textContent=p?`${p.name}${p.kelas?' · '+p.kelas:''}`:'Belum menetapkan nama / 尚未设置学生名字';const reads=[...new Set(data.filter(x=>x.type==='read'&&!/dashboard/i.test(x.file)).map(x=>x.file))];const quizzes=data.filter(x=>x.type==='quiz');readCount.textContent=reads.length;quizCount.textContent=quizzes.length;avg.textContent=quizzes.length?Math.round(quizzes.reduce((a,b)=>a+(b.percent||0),0)/quizzes.length)+'%':'0%';let wrong=quizzes.flatMap(q=>(q.wrong||[]).map(w=>({...w,work:q.work,file:q.file})));pending.textContent=wrong.filter(w=>w.status!=='done').length;const sk={};quizzes.forEach(q=>Object.entries(q.skills||{}).forEach(([k,v])=>{sk[k]??={correct:0,total:0};sk[k].correct+=v.correct;sk[k].total+=v.total}));skills.innerHTML=Object.entries(sk).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total)).map(([k,v])=>{const pc=Math.round(v.correct/v.total*100);return `<p><b>${k}</b> ${pc}%</p><div class="bar"><div class="fill" style="width:${pc}%"></div></div>`}).join('')||'<p>Belum ada data latihan.</p>';quizRows.innerHTML=quizzes.slice().reverse().map(q=>`<tr><td>${q.work}</td><td><b>${q.correct}/${q.total}</b> (${q.percent}%)</td><td>${(q.wrong||[]).length}</td><td><span class="tag ${q.percent>=80?'ok':'bad'}">${q.percent>=80?'Baik':'Perlu kukuh'}</span></td></tr>`).join('')||'<tr><td colspan="4">Belum membuat latihan.</td></tr>';wrongList.innerHTML=wrong.slice(-30).reverse().map(w=>`<p><span class="tag bad">Soalan ${w.no} · ${w.skill}</span> <b>${w.work}</b><br>${w.question}<br><small>Jawapan betul: ${w.correctAnswer}</small></p>`).join('')||'<p>Tiada pembetulan tertunggak.</p>';const weak=Object.entries(sk).map(([k,v])=>[k,Math.round(v.correct/v.total*100)]).filter(x=>x[1]<70).sort((a,b)=>a[1]-b[1]);recommend.innerHTML=weak.length?weak.map(([k,p])=>`<p><b>${k} (${p}%)</b> — ulang nota berkaitan, semak contoh jawapan, kemudian buat semula soalan salah bagi kemahiran ini.</p>`).join(''):'<p>Tiada kelemahan jelas lagi. Teruskan latihan secara berkala.</p>'}async function load(){let d=localData();try{const p=profile();if(p){const r=await fetch('/api/student?name='+encodeURIComponent(p.name));if(r.ok){const j=await r.json();if(Array.isArray(j.events)&&j.events.length)d=j.events}}}catch{}render(d)}function changeStudent(){const n=(prompt('Nama pelajar / 学生名字')||'').trim();if(!n)return;const k=(prompt('Kelas / 班级（可留空）')||'').trim();KOMSASTracker.saveProfile(n,k);location.reload()}load();</script></body></html>
