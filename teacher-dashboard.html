<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard KOMSAS</title><style>:root{--b:#2f6df6;--g:#23b574;--r:#df4f64;--ink:#20324d;--muted:#73819a;--line:#dbe7f7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#eaf2ff,#f8fbff);color:var(--ink)}.wrap{max-width:1250px;margin:auto;padding:24px}.home{display:inline-block;background:#fff;border:1px solid var(--line);box-shadow:0 5px 0 #cad9ef;border-radius:13px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:900}.hero{margin:22px 0;background:linear-gradient(145deg,#283e7a,#654ee6);color:#fff;padding:28px;border-radius:26px;box-shadow:0 13px 0 #253974}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 7px 0 #d4e1f3}.stat b{display:block;font-size:1.8rem}.panel{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}input,select{padding:10px;border:1px solid var(--line);border-radius:10px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:.75rem;font-weight:900}.bad{background:#ffe8eb;color:#b42336}.ok{background:#e8f8f1;color:#117655}.warn{background:#fff3cf;color:#8a6410}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="home" href="index.html">← 主页 / Laman Utama</a><section class="hero"><h1>Teacher Dashboard 老师学习追踪</h1><p>阅读记录、练习成绩、错题、待订正、技能弱点与补救建议。</p></section><div class="grid"><div class="stat"><b id="students">0</b>Pelajar</div><div class="stat"><b id="attempts">0</b>Percubaan</div><div class="stat"><b id="average">0%</b>Purata</div><div class="stat"><b id="pending">0</b>Belum dibetulkan</div></div><section class="panel"><h2>Carian & Penapis</h2><input id="search" placeholder="Nama pelajar / 学生名字" oninput="render()"> <select id="filter" onchange="render()"><option value="all">Semua</option><option value="weak">Perlu pengukuhan &lt;70%</option><option value="pending">Ada pembetulan</option></select></section><section class="panel"><h2>Prestasi Pelajar 学生成绩</h2><div style="overflow:auto"><table><thead><tr><th>Pelajar</th><th>Kelas</th><th>Dibaca</th><th>Latihan</th><th>Purata</th><th>Belum Betul</th><th>Fokus</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>Butiran Pelajar 学生详细记录</h2><div id="detail">Klik nama pelajar untuk melihat butiran.</div></section></div><script>let EVENTS=[];function group(){const m={};EVENTS.forEach(e=>{if(!e.student)return;m[e.student]??={name:e.student,kelas:e.kelas||'',events:[]};m[e.student].events.push(e)});return Object.values(m)}function statsFor(s){const reads=[...new Set(s.events.filter(e=>e.type==='read'&&!/dashboard/i.test(e.file)).map(e=>e.file))];const qs=s.events.filter(e=>e.type==='quiz');const avg=qs.length?Math.round(qs.reduce((a,b)=>a+(b.percent||0),0)/qs.length):0;const wrong=qs.flatMap(q=>q.wrong||[]);const skills={};qs.forEach(q=>Object.entries(q.skills||{}).forEach(([k,v])=>{skills[k]??={correct:0,total:0};skills[k].correct+=v.correct;skills[k].total+=v.total}));const weakest=Object.entries(skills).map(([k,v])=>[k,Math.round(v.correct/v.total*100)]).sort((a,b)=>a[1]-b[1])[0];return{reads:reads.length,qs:qs.length,avg,pending:wrong.filter(w=>w.status!=='done').length,weakest,wrong,skills}}function render(){const q=search.value.toLowerCase();const f=filter.value;let ss=group().map(s=>({...s,st:statsFor(s)})).filter(s=>s.name.toLowerCase().includes(q));if(f==='weak')ss=ss.filter(s=>s.st.avg<70);if(f==='pending')ss=ss.filter(s=>s.st.pending>0);students.textContent=group().length;const allQ=EVENTS.filter(e=>e.type==='quiz');attempts.textContent=allQ.length;average.textContent=allQ.length?Math.round(allQ.reduce((a,b)=>a+(b.percent||0),0)/allQ.length)+'%':'0%';pending.textContent=allQ.flatMap(q=>q.wrong||[]).filter(w=>w.status!=='done').length;rows.innerHTML=ss.map((s,i)=>`<tr><td><button onclick="showStudent('${encodeURIComponent(s.name)}')" style="border:0;background:none;color:#2f6df6;font-weight:900;cursor:pointer">${s.name}</button></td><td>${s.kelas||'-'}</td><td>${s.st.reads}</td><td>${s.st.qs}</td><td><span class="tag ${s.st.avg>=80?'ok':s.st.avg>=70?'warn':'bad'}">${s.st.avg}%</span></td><td>${s.st.pending}</td><td>${s.st.weakest?s.st.weakest[0]+' '+s.st.weakest[1]+'%':'-'}</td></tr>`).join('')||'<tr><td colspan="7">Tiada data.</td></tr>'}function showStudent(nameEnc){const name=decodeURIComponent(nameEnc);const s=group().find(x=>x.name===name);if(!s)return;const st=statsFor(s);const qs=s.events.filter(e=>e.type==='quiz').slice().reverse();const weak=Object.entries(st.skills).map(([k,v])=>[k,Math.round(v.correct/v.total*100)]).sort((a,b)=>a[1]-b[1]);detail.innerHTML=`<h3>${s.name} ${s.kelas?'· '+s.kelas:''}</h3><p><b>Purata:</b> ${st.avg}% · <b>Latihan:</b> ${st.qs} · <b>Belum dibetulkan:</b> ${st.pending}</p><h4>Kemahiran lemah</h4>${weak.map(([k,p])=>`<p>${k}: <b>${p}%</b> ${p<70?'→ Perlu ulang nota + buat semula soalan salah':''}</p>`).join('')||'<p>Tiada data kemahiran.</p>'}<h4>Sejarah latihan</h4>${qs.map(q=>`<p><b>${q.work}</b> — ${q.correct}/${q.total} (${q.percent}%) · salah ${(q.wrong||[]).length}</p>`).join('')||'<p>Belum membuat latihan.</p>'}<h4>Pembetulan tertunggak</h4>${st.wrong.slice(-20).map(w=>`<p><span class="tag bad">S${w.no} · ${w.skill}</span> ${w.question}<br><small>Jawapan: ${w.correctAnswer}</small></p>`).join('')||'<p>Tiada.</p>'}`}async function load(){try{const r=await fetch('/api/teacher');if(r.ok){const j=await r.json();EVENTS=j.events||[]}}catch{}render()}load();</script></body></html>
